# Driver Enhancement Architecture Basis
# Source step: driver-enhancement-foundation.architecture-basis
# Scope: post-bootstrap driver enhancement wave only; no bootstrap-minimum continuity changes.

metadata:
  artifact_id: driver-enhancement-architecture-basis
  version: "1.0.0"
  status: proposed
  created: 2026-03-29
  owner_step: driver-enhancement-foundation.architecture-basis
  persona: software-architect

scope:
  in_scope:
    - runner lifecycle observability
    - planner dispatch observability
    - recovery observability
    - streaming-aware liveness contracts
    - crash/fail/timeout/stall/no_progress taxonomy
    - future multi-runner fallback boundaries
  out_of_scope:
    - bootstrap-minimum continuity authority already pinned by docs/DRIVER-CONTINUITY-FOUNDATION.md
    - implementation code, persistence mechanics, and behavior changes
    - changes to vectl plan authority or orchestrator state files

sources:
  - "README.md (repo-root vectl README; tools/vectl/README.md is not present in this worktree)"
  - "docs/DRIVER-ARCHITECTURE.md"
  - "docs/ADR-driver-evolution-foundation.md"
  - "docs/DRIVER-CONTINUITY-FOUNDATION.md"
  - "src/vectl/driver/loop.py"
  - "src/vectl/driver/types.py"
  - "src/vectl/driver/runtime_context.py"
  - "src/vectl/driver/action_registry.py"
  - "src/vectl/driver/events/registry.py"
  - "src/vectl/driver/events/emitter.py"
  - "src/vectl/driver/events/sinks.py"
  - "src/vectl/driver/runners.py"
  - "src/vectl/driver/parsers.py"
  - "src/vectl/driver/session.py"
  - "src/vectl/driver/runner_continuity.py"
  - "src/vectl/driver/policy.py"

architecture_basis:
  system_layers:
    - order: 1
      name: vectl core authority layer
      owner: vectl core modules
      responsibilities:
        - own plan graph, claim lifecycle, and decide-local state semantics
        - remain the sole authority for plan mutation and DAG truth
      rationale: "[Proven] README.md defines vectl as the execution control plane, and loop.py imports vectl lifecycle/decide APIs rather than replacing them."
    - order: 2
      name: driver orchestration control plane
      owner: src/vectl/driver/loop.py with DriverState and RuntimeContext
      responsibilities:
        - wire runtime startup, decide-dispatch-wait-reconcile, shutdown, and registry-backed action execution
        - own mutable in-process orchestration state but not event schema truth or durable continuity truth
      rationale: "[Proven] loop.py, types.py, and runtime_context.py explicitly assign orchestration ownership to loop.py, DriverState, and RuntimeContext."
    - order: 3
      name: driver contract and governance layer
      owner: src/vectl/driver/action_registry.py, src/vectl/driver/events/registry.py, src/vectl/driver/policy.py, src/vectl/driver/runner_continuity.py
      responsibilities:
        - own static action declarations, event schemas, policy extraction seams, and continuity capability contracts
        - constrain extension points so enhancement work does not reintroduce implicit behavior growth
      rationale: "[Proven] ADR-driver-evolution-foundation.md and current modules already establish static registries and pure-helper boundaries."
    - order: 4
      name: execution transport layer
      owner: src/vectl/driver/runners.py, src/vectl/driver/parsers.py, src/vectl/driver/worktree.py
      responsibilities:
        - own CLI subprocess dispatch, final output parsing, and git worktree lifecycle
        - surface transport facts without taking ownership of semantic recovery policy
      rationale: "[Proven] runners.py and parsers.py separate process launch from output parsing; worktree.py owns git side effects."
    - order: 5
      name: enhancement observability and liveness layer
      owner: new enhancement-wave contracts and modules under src/vectl/driver/
      responsibilities:
        - normalize runner heartbeat/progress signals, planner dispatch snapshots, recovery decision snapshots, and watchdog classifications
        - provide streaming-aware liveness signals to loop.py without moving control authority out of the loop
      rationale: "[Likely] current code has event schemas and terminal results, but no dedicated shared contracts for heartbeat/progress/liveness; enhancement work needs a separate reason-to-change from terminal parsing."
    - order: 6
      name: recovery coordination layer
      owner: loop.py startup recovery boundary today; enhancement-wave recovery coordinator for runtime observability decisions
      responsibilities:
        - consume continuity facts, liveness facts, and taxonomy classifications to choose recover, fallback, halt, or planner-remediation paths
        - keep startup continuity authority distinct from runtime observability and watchdog reactions
      rationale: "[Likely] DRIVER-CONTINUITY-FOUNDATION.md already isolates continuity authority, so enhancement recovery should consume that contract rather than redefine it."

  source_of_truth_matrix:
    - concern: plan graph and claims lifecycle
      authority: "vectl core (`plan.yaml`, lifecycle ops, claims repair)"
      consumers:
        - loop.py
      rationale: "[Proven] loop.py loads the plan, repairs claims, and treats vectl core as external authority."
    - concern: decide-side dispatch intent
      authority: "DecideState via vectl.decide"
      consumers:
        - loop.py
        - session.py
      rationale: "[Proven] session.py explicitly states DecideState owns reuse-vs-fresh intent."
    - concern: runner-aware ephemeral reusable session cache
      authority: SessionPool
      consumers:
        - loop.py
      rationale: "[Proven] session.py defines SessionPool as a supplementary runner-aware cache, not durable truth."
    - concern: mutable runtime orchestration state
      authority: DriverState
      consumers:
        - loop.py
        - runtime_context.py
      rationale: "[Proven] DriverState is declared the single owner of running-task bookkeeping."
    - concern: event names, payload requirements, and compatibility notes
      authority: driver.events.registry
      consumers:
        - events.emitter
        - events.sinks
        - loop.py
        - judge.py
      rationale: "[Proven] observe.py and ADR-driver-evolution-foundation.md name the registry as the canonical schema source."
    - concern: action type declarations and handler/event expectations
      authority: driver.action_registry
      consumers:
        - loop.py
      rationale: "[Proven] action_registry.py declares the auditable registry scope, including planner dispatch."
    - concern: runner continuity capabilities and replay safety constraints
      authority: driver.runner_continuity + continuity types in driver.types
      consumers:
        - loop.py
      rationale: "[Proven] continuity contracts already own capability snapshots and replay-safety inputs."
    - concern: runner lifecycle observability snapshots
      authority: "new enhancement-wave shared contracts (recommended owner: src/vectl/driver/observability_contracts.py)"
      consumers:
        - loop.py
        - events.emitter
        - watchdog/liveness module
        - recovery coordinator
      rationale: "[Likely] terminal events alone cannot express heartbeat/progress semantics without conflating transport facts and recovery policy."
    - concern: runner liveness classification and failure taxonomy
      authority: "new enhancement-wave liveness contract module (recommended owner: src/vectl/driver/liveness.py)"
      consumers:
        - loop.py
        - recovery coordinator
        - observability contracts
      rationale: "[Likely] timeout/stall/no_progress/crash should be normalized once so loop.py, recovery, and telemetry do not drift."
    - concern: recovery decisions produced from runtime observability
      authority: "new enhancement-wave recovery coordinator contract (recommended owner: src/vectl/driver/recovery_coordinator.py)"
      consumers:
        - loop.py
        - events.emitter
      rationale: "[Likely] startup recovery is already a bounded contract; runtime recovery decisions deserve a similarly explicit owner."
    - concern: planner dispatch audit facts
      authority: existing planner dispatch events plus new planner snapshot contract
      consumers:
        - loop.py
        - event sinks
        - future dashboards/audit tools
      rationale: "[Proven] PLANNER_DISPATCH_STARTED/COMPLETED/FAILED already exist; [Likely] a shared snapshot contract is needed once multiple consumers read them."

  service_catalog:
    - service: src/vectl/driver/loop.py
      role: stable orchestration skeleton and startup recovery consumer
      depends_on:
        - vectl core lifecycle and decide APIs
        - RuntimeContext
        - DriverState
        - SessionPool
        - Judge
        - runners/parsers/worktree
        - action registry and event registry
      rationale: "[Proven] current loop.py is the runtime coordinator and should remain so."
    - service: src/vectl/driver/events/registry.py
      role: canonical event declaration table
      depends_on:
        - events.types
      rationale: "[Proven] the registry already owns event schema/version truth."
    - service: src/vectl/driver/action_registry.py
      role: canonical loop action declaration table including planner dispatch
      depends_on:
        - RuntimeContext
        - vectl.models.Action
      rationale: "[Proven] planner dispatch is already first-class in the layered action registry."
    - service: src/vectl/driver/runtime_context.py
      role: shared handler wiring boundary
      depends_on:
        - DriverState
        - DriverConfig
        - runners
        - Judge
        - SessionPool
        - Observer
      rationale: "[Proven] current ADR-approved handler context is a unified RuntimeContext."
    - service: src/vectl/driver/session.py
      role: runner-aware ephemeral session cache
      depends_on:
        - SessionEntry
        - SessionConfig
      rationale: "[Proven] session.py already owns this optimization boundary."
    - service: src/vectl/driver/runner_continuity.py
      role: continuity capability contract source
      depends_on:
        - continuity types in driver.types
      rationale: "[Proven] bootstrap continuity authority is already pinned here."
    - service: src/vectl/driver/runners.py + src/vectl/driver/parsers.py
      role: transport adapter layer for subprocess dispatch and terminal result parsing
      depends_on:
        - config
        - errors
        - types
      rationale: "[Proven] transport launch and parse surfaces are already separated."
    - service: src/vectl/driver/observability_contracts.py
      status: recommended_new_module
      role: shared heartbeat/progress/planner/recovery snapshot contracts for enhancement consumers
      depends_on:
        - driver.types or a small shared contract subset
        - driver.events.types
      rationale: "[Likely] this prevents types.py, events.registry, and loop.py from each inventing their own observability shapes."
    - service: src/vectl/driver/streaming.py
      status: recommended_new_module
      role: streaming reader lifecycle and progress normalization boundary
      depends_on:
        - runners.RunnerHandle
        - observability contracts
        - parser-compatible stream metadata
      rationale: "[Likely] streaming-aware liveness has a different reason to change than terminal parsing, so it should not be absorbed into parsers.py."
    - service: src/vectl/driver/liveness.py
      status: recommended_new_module
      role: watchdog contracts and transport-to-taxonomy liveness classification
      depends_on:
        - observability contracts
        - DriverState read-only views
        - runner continuity capability inputs when relevant
      rationale: "[Likely] timeout/stall/no_progress/crash classification needs one owner to avoid duplicated heuristics."
    - service: src/vectl/driver/recovery_coordinator.py
      status: recommended_new_module
      role: runtime recovery decision contract consuming liveness and continuity facts
      depends_on:
        - liveness classifications
        - continuity contracts
        - planner dispatch contract
      rationale: "[Likely] runtime recovery decisions should be explicit and auditable, not scattered through loop branches."

  runtime_contract:
    dispatch_flow:
      - "[Proven] loop.run() initializes config, observer, state, runners, session pool, judge, and RuntimeContext before entering the loop."
      - "[Proven] loop.py treats startup recovery as a pre-loop contract stage and emits STARTUP_RECOVERY_DECISION events before ordinary dispatch resumes."
      - "[Proven] execution actions remain registry-backed; planner dispatch is already routed through PLANNER_DISPATCH_* events and dedicated action declarations."
    observability_contract:
      - "[Likely] runner lifecycle observability must emit a shared snapshot at three moments: dispatch accepted, progress/heartbeat observed, terminal classification resolved."
      - "[Likely] planner dispatch observability must preserve trigger, judgment_type, runner, session_id when present, and terminal elapsed_seconds so downstream tools can distinguish replan vs gate-remediation traffic."
      - "[Likely] recovery observability must record reasoned decisions, not only side effects, so RECOVERY becomes a family of auditable decisions rather than a single opaque event kind."
    streaming_aware_liveness:
      - "[Proven] runners already expose pid, is_alive(), and wait(timeout)."
      - "[Likely] enhancement liveness must consume both process aliveness and streaming progress pulses; lack of final completion alone is insufficient to declare a stall if progress continues."
      - "[Likely] no_progress is an input state detected from missing progress heartbeats within a configured window; stall is the coordinator-level terminal classification that may trigger recovery or fallback."
    failure_taxonomy:
      - name: crash
        definition: "[Likely] transport process disappears or terminates without a valid protocol-complete result, leaving control flow to recover from an abnormal process loss rather than a semantic task result."
        owner: liveness classification contract
      - name: fail
        definition: "[Proven] runner returns a terminal unsuccessful semantic result (`RunnerStatus.FAIL`) or judge-driven failure disposition after a completed attempt."
        owner: runners/parsers + judge/policy + reconcile path
      - name: timeout
        definition: "[Proven] configured wait boundary expires for runner or judge transport and is surfaced as timeout-owned error handling."
        owner: runners.py and judge.py timeout boundaries; normalized by liveness contract
      - name: no_progress
        definition: "[Likely] runner remains potentially alive but emits no heartbeat/progress snapshot inside the liveness window; this is not itself recovery, but an escalation input."
        owner: streaming/liveness contracts
      - name: stall
        definition: "[Proven for existing status, Likely for enhanced semantics] system-level determination that useful forward progress has ceased and recovery coordination must intervene; currently represented by RunnerStatus.STALL and recovery.all_stalled flow."
        owner: liveness contract feeding recovery coordinator
      - name: transport_error
        definition: "[Proven] parser could not extract valid protocol output or subprocess wait failed at the transport boundary."
        owner: runners/parsers
    future_multi_runner_fallback_boundary:
      - "[Likely] fallback selection may switch runner identity only through a dedicated fallback/recovery decision contract, never by mutating transport-session state in place."
      - "[Likely] session_id, replay token, and capability snapshot are runner-bound and MUST NOT be assumed portable across runners."
      - "[Likely] cross-runner fallback consumes taxonomy and continuity facts, but durable continuity authority remains with continuity contracts rather than fallback policy."

  state_strata:
    - stratum: intent
      owner: DecideState
      contents:
        - reuse vs fresh dispatch intent
        - decide-local failure memory
      rationale: "[Proven] session.py and runtime_context.py already keep decide-local state separate from RuntimeContext and SessionPool."
    - stratum: resolved_contract
      owner: driver.types, driver.runner_continuity, driver.events.registry, driver.action_registry
      contents:
        - event and action declarations
        - continuity/replay/capability contracts
        - enhancement-wave snapshot and taxonomy contracts
      rationale: "[Proven] existing contract modules already separate durable/shared truth from mutable process state; [Likely] new observability contracts should join this stratum."
    - stratum: mutable_runtime_state
      owner: DriverState and loop.py
      contents:
        - running handles
        - failure counters and histories
        - agent overrides
        - lifecycle-scoped capability snapshot cache
      rationale: "[Proven] DriverState is the single runtime owner for these fields."
    - stratum: transport_session_state
      owner: runners and subprocess handles
      contents:
        - pid
        - live subprocess state
        - runner-native session identifiers and resume flags
        - streaming reader cursors
      rationale: "[Proven] runners expose pid/session_id/is_alive; [Likely] streaming cursors belong here because they are transport-lifecycle data, not orchestration truth."
    - stratum: durable_recovery_state
      owner: continuity contracts and future persistence implementation
      contents:
        - ContinuityLedgerEntry
        - ContinuityJournalEntry
        - startup recovery inputs/outputs
        - future durable recovery decision records if replay/restart needs them
      rationale: "[Proven] continuity foundation already separates durable truth from process memory."

  transport_boundary_rules:
    - "[Proven] runner subprocess protocols surface raw transport facts; semantic policy and recovery decisions stay above the transport layer."
    - "[Proven] event envelope version/schema ownership remains in driver.events.registry and events.types, not inside transport adapters."
    - "[Likely] streaming readers may normalize progress into heartbeat/progress snapshots, but they MUST NOT directly trigger planner dispatch, fallback, or plan mutation."
    - "[Likely] liveness watchdogs consume normalized snapshots plus handle.is_alive()/wait(timeout) results; watchdogs are advisory classifiers, not lifecycle authorities."
    - "[Proven] session reuse is runner-aware and best-effort; [Likely] future fallback across runners must invalidate or re-evaluate runner-bound session/replay state rather than reusing it blindly."
    - "[Likely] crash recovery after process death must re-enter through continuity/recovery coordination surfaces, never through cached streaming reader state."
    - "[Likely] parser modules stay terminal-result oriented; incremental stream observation belongs to a separate streaming lifecycle boundary so terminal parsing and progress monitoring do not collapse into one module."

  cross_cutting_governance:
    registries:
      - name: event_registry
        owner_module: src/vectl/driver/events/registry.py
        write_policy: static declaration table only; additive reviewable edits
        rationale: "[Proven] ADR-driver-evolution-foundation.md explicitly forbids dynamic event registration."
      - name: action_registry
        owner_module: src/vectl/driver/action_registry.py
        write_policy: static declaration table only; planner/execution/control/recovery categories remain explicit
        rationale: "[Proven] action_registry.py already codifies layered categories and planner dispatch inclusion."
      - name: liveness_taxonomy_registry
        owner_module: src/vectl/driver/liveness.py
        status: recommended_new_registry_surface
        write_policy: static declaration table mirroring event/action registry posture
        rationale: "[Likely] failure taxonomy should be auditable once, not rederived in loop.py, parsers, and recovery code."
    lifecycle_ordering:
      - "[Proven] startup order: config -> observer/state -> runners/session/judge -> RuntimeContext -> plan/claims/worktree repair -> startup recovery -> main loop."
      - "[Likely] per-dispatch order for enhancement work: runner handle created -> optional streaming reader attached -> watchdog subscribed -> terminal reconcile tears down reader/watchdog before merge and final accounting."
      - "[Likely] shutdown order: stop watchdog evaluation -> kill/await transport handles -> emit final recovery/lifecycle facts -> close observer sink."
    coordination_mechanisms:
      - mechanism: RuntimeContext
        owner: runtime_context.py
        rationale: "[Proven] current handlers already receive shared RuntimeContext."
      - mechanism: DriverState
        owner: types.py / loop.py
        rationale: "[Proven] single mutable runtime owner prevents double-truth orchestration state."
      - mechanism: canonical event emission
        owner: events.emitter + events.sinks
        rationale: "[Proven] typed helpers and sink validation already coordinate event durability."
      - mechanism: startup recovery boundary input/output
        owner: loop.py + driver.types
        rationale: "[Proven] startup recovery already flows through typed boundary objects."
      - mechanism: watchdog-to-recovery handoff
        owner: new liveness + recovery coordinator contracts
        rationale: "[Likely] recovery should consume normalized liveness outputs instead of ad hoc booleans or direct handle inspection scattered across loop branches."
    wiring_strategy:
      description: explicit initialization in loop.run() with constructor/build-function wiring; registries stay static and handlers receive dependencies via RuntimeContext
      rationale: "[Proven] current driver already prefers explicit wiring over dynamic discovery, and this should be preserved for enhancement work."
    governance_owner:
      event_registry: src/vectl/driver/events/registry.py
      streaming_reader_lifecycle: "[Likely] src/vectl/driver/streaming.py while loop.py remains start/stop authority"
      watchdog_ownership: "[Likely] src/vectl/driver/liveness.py owns classification rules; loop.py owns when watchdog evaluation starts/stops"
      recovery_coordination: "[Proven/Likely] startup recovery stays with loop.py + continuity contracts; runtime recovery decision normalization should move to src/vectl/driver/recovery_coordinator.py"

  shared_abstractions:
    shared_types:
      - name: RunnerHeartbeatSnapshot
        owner_module: src/vectl/driver/observability_contracts.py
        consumers:
          - streaming.py
          - liveness.py
          - loop.py
          - events.emitter
        rationale: "[Likely] a single heartbeat shape avoids different payloads for liveness, event emission, and recovery."
      - name: RunnerProgressSnapshot
        owner_module: src/vectl/driver/observability_contracts.py
        consumers:
          - streaming.py
          - liveness.py
          - loop.py
          - events.emitter
        rationale: "[Likely] progress updates are distinct from heartbeats and terminal results, so they need a stable shared contract."
      - name: RunnerLivenessState
        owner_module: src/vectl/driver/liveness.py
        consumers:
          - loop.py
          - recovery_coordinator.py
          - observability_contracts.py
        rationale: "[Likely] crash/timeout/no_progress/stall classification should be normalized once."
      - name: RecoveryDecisionSnapshot
        owner_module: src/vectl/driver/recovery_coordinator.py
        consumers:
          - loop.py
          - events.emitter
          - future dashboards
        rationale: "[Likely] recovery observability should record the decision basis, not just the side effect."
      - name: PlannerDispatchSnapshot
        owner_module: src/vectl/driver/observability_contracts.py
        consumers:
          - loop.py
          - events.emitter
          - future analytics/dashboard consumers
        rationale: "[Likely] started/completed/failed planner events already share fields and should not drift as more consumers appear."
    shared_protocols:
      - name: StreamProgressSource
        owner_module: src/vectl/driver/streaming.py
        consumers:
          - runners.py
          - liveness.py
          - loop.py
        rationale: "[Likely] streaming-aware liveness needs a protocol boundary between transport readers and watchdog classification."
      - name: RunnerLivenessClassifier
        owner_module: src/vectl/driver/liveness.py
        consumers:
          - loop.py
          - recovery_coordinator.py
        rationale: "[Likely] loop and recovery should consume one classification contract instead of private heuristics."
      - name: RecoveryCoordinator
        owner_module: src/vectl/driver/recovery_coordinator.py
        consumers:
          - loop.py
          - future operator/reporting surfaces
        rationale: "[Likely] recovery decisions need an explicit protocol like startup recovery already has."
    shared_utilities:
      - name: taxonomy_to_event_payload
        owner_module: src/vectl/driver/observability_contracts.py
        consumers:
          - events.emitter
          - liveness.py
          - recovery_coordinator.py
        rationale: "[Speculative] if multiple modules serialize the same taxonomy/snapshot fields, a shared utility may prevent envelope drift; do not create it unless at least three call sites exist."
    decision: "[Likely] keep existing broad shared contracts in driver.types for current runtime/continuity truth, but place enhancement-only observability and liveness abstractions in narrowly named modules so types.py does not become the hidden god module."

  module_split_recommendations:
    - module: src/vectl/driver/loop.py
      recommendation: keep as orchestration skeleton; do not absorb streaming readers, watchdog rules, or recovery snapshot shaping
      rationale: "[Proven] ADR-driver-evolution-foundation.md explicitly aims to stabilize loop.py under growth."
      merge_justification: "Loop cannot be merged with liveness/recovery modules without reintroducing branch sprawl and mixed reasons to change."
    - module: src/vectl/driver/parsers.py
      recommendation: keep terminal parse responsibility only
      rationale: "[Proven] current parsers own final output parsing; [Likely] incremental stream handling is a separate change axis."
      merge_justification: "Merging streaming progress handling into parsers.py would couple terminal schema changes with live-reader lifecycle changes."
    - module: src/vectl/driver/streaming.py
      recommendation: add for reader lifecycle, incremental normalization, and heartbeat/progress extraction
      rationale: "[Likely] streaming-aware liveness needs a module with a distinct reason to change from transport spawning and terminal parsing."
      merge_justification: "Cannot be merged into runners.py without making transport adapters own cross-runner observability semantics."
    - module: src/vectl/driver/liveness.py
      recommendation: add for watchdog ownership and taxonomy classification
      rationale: "[Likely] crash/timeout/no_progress/stall rules should have one owner shared by loop and recovery code."
      merge_justification: "Cannot be merged into recovery coordinator because classification and remediation are separate decision axes."
    - module: src/vectl/driver/recovery_coordinator.py
      recommendation: add runtime recovery decision boundary consuming liveness and continuity facts
      rationale: "[Likely] recovery observability and future multi-runner fallback require an explicit decision surface."
      merge_justification: "Cannot be merged into liveness.py because detecting a problem and deciding remediation are different responsibilities."
    - module: src/vectl/driver/observability_contracts.py
      recommendation: add only shared snapshot/value contracts used by 2+ modules
      rationale: "[Likely] enhancement-only shared types should not bloat types.py unless they remain truly central."
      merge_justification: "If these shapes stay in loop.py or events.registry, consumers will duplicate them; if they all live in types.py, types.py becomes less cohesive."
    - module: src/vectl/driver/events/registry.py
      recommendation: keep as the only event schema owner; enhancement events must be added here, not invented inline
      rationale: "[Proven] static registry ownership is an approved ADR decision."
      merge_justification: "Must not merge into emitter/sinks because declaration truth and emission/durability are separate reasons to change."
    - module: src/vectl/driver/runner_continuity.py
      recommendation: keep bootstrap continuity authority separate from enhancement liveness and fallback policy
      rationale: "[Proven] continuity foundation explicitly excludes richer observability and analytics."
      merge_justification: "Merging enhancement recovery logic into continuity would collapse bootstrap durability truth with runtime observability policy."

  open_questions:
    - question: Where should enhancement-only shared snapshot contracts live: extend driver.types or introduce observability_contracts.py?
      blocking: false
      rationale: "[Likely] ownership is clear either way, but module placement affects cohesion and import shape."
    - question: Should streaming normalization operate on raw stdout/stderr lines, parser-native events, or a new runner handle callback surface?
      blocking: false
      rationale: "[Likely] all options preserve the proposed boundaries, but they differ in coupling to runner adapters."
    - question: Is no_progress threshold globally configured, per runner, or derived from runner capability metadata?
      blocking: false
      rationale: "[Likely] the taxonomy owner is clear, but the configuration surface is not yet pinned."
    - question: Do recovery decision snapshots need durable persistence, or is append-only event durability sufficient for the enhancement wave?
      blocking: false
      rationale: "[Likely] this affects storage choice, not module ownership."
    - question: When future multi-runner fallback switches runners, should the continuity ledger record the switch as a new attempt lineage or as one lineage with runner transitions?
      blocking: false
      rationale: "[Likely] boundary is clear that runner-bound session state is non-portable, but durable modeling remains open."

  readiness:
    status: READY
    assessment: "[Likely] ready for downstream decomposition because module ownership, dependency direction, state strata, and transport boundaries are explicit; remaining questions are implementation-shape choices rather than missing architectural authority."
    preserved_constraints:
      - bootstrap continuity scope stays separate from enhancement observability scope
      - vectl core remains plan and lifecycle authority
      - event and action declarations remain static registries
      - loop.py stays orchestration owner rather than becoming a telemetry or watchdog god module
      - future multi-runner fallback may consume runner-bound facts but may not treat them as portable across runners
