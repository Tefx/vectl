# Driver Enhancement Recovery Observability Contract
# Source step: driver-enhancement-foundation.contract
# Scope: Pin runtime recovery decision and coordination observability contracts for the enhancement wave.

metadata:
  contract_id: driver-enhancement-recovery-observability-contract
  version: "1.0.0"
  status: proposed
  created: 2026-03-29
  owner_step: driver-enhancement-foundation.contract

sources:
  - "docs/contracts/driver-enhancement-architecture-basis.yaml#source_of_truth_matrix"
  - "docs/contracts/driver-enhancement-architecture-basis.yaml#runtime_contract"
  - "docs/contracts/driver-enhancement-architecture-basis.yaml#state_strata"
  - "docs/contracts/driver-enhancement-architecture-basis.yaml#cross_cutting_governance"
  - "docs/contracts/driver-enhancement-architecture-basis.yaml#shared_abstractions"
  - "docs/DRIVER-ARCHITECTURE.md#1-2-dependency-direction-rules"
  - "src/vectl/driver/types.py (StartupRecoveryBoundaryInput, StartupRecoveryBoundaryOutput, StartupRecoveryController)"
  - "src/vectl/driver/events/registry.py (RECOVERY, RUNNER_FALLBACK, STARTUP_RECOVERY_DECISION)"
  - "src/vectl/driver/runner_continuity.py"
  - "src/vectl/driver/loop.py (startup recovery authority precedent)"

authoritative_sources:
  architecture_basis_sections:
    - "source_of_truth_matrix.concern=recovery decisions produced from runtime observability"
    - "runtime_contract.observability_contract"
    - "runtime_contract.future_multi_runner_fallback_boundary"
    - "state_strata.durable_recovery_state"
    - "cross_cutting_governance.coordination_mechanisms.watchdog-to-recovery handoff"
    - "shared_abstractions.shared_types.RecoveryDecisionSnapshot"
    - "shared_abstractions.shared_protocols.RecoveryCoordinator"
  rationale: >-
    The architecture basis requires runtime recovery to consume normalized liveness and
    continuity facts through an explicit decision surface so recovery remains auditable
    and does not sprawl across loop branches.

ownership:
  owner_module: "src/vectl/driver/recovery_coordinator.py"
  upstream_contracts:
    liveness_state_owner: "src/vectl/driver/liveness.py"
    continuity_authority_owner: "src/vectl/driver/runner_continuity.py"
    event_schema_owner: "src/vectl/driver/events/registry.py"
  runtime_authority:
    decision_execution_owner: "src/vectl/driver/loop.py"
    durable_continuity_authority: "src/vectl/driver/runner_continuity.py"
  primary_consumers:
    - "src/vectl/driver/loop.py"
    - "src/vectl/driver/events/emitter.py"
    - "future operator/reporting surfaces"

exact_signatures:
  type_aliases:
    RecoveryDecisionType: 'Literal["resume_existing_runner", "restart_same_runner", "fallback_runner", "planner_replan", "halt", "await_judgment"]'
    RecoveryDecisionSeverity: 'Literal["info", "warning", "critical"]'
    ContinuityCompatibility: 'Literal["not_applicable", "resume_safe", "restart_required", "halt_required"]'
  dataclasses:
    RecoveryCoordinationInput: |
      @dataclass(frozen=True)
      class RecoveryCoordinationInput:
          step_id: str
          runner_name: str
          observed_at: float
          liveness_state: RunnerLivenessState
          terminal_result: RunnerResult | None
          continuity_compatibility: ContinuityCompatibility
          planner_dispatch_allowed: bool
    RecoveryDecisionSnapshot: |
      @dataclass(frozen=True)
      class RecoveryDecisionSnapshot:
          step_id: str
          runner_name: str
          decision_type: RecoveryDecisionType
          severity: RecoveryDecisionSeverity
          reason: str
          observed_at: float
          liveness_classification: RunnerLivenessClassification
          continuity_compatibility: ContinuityCompatibility
          requires_planner_dispatch: bool
          fallback_runner: str | None = None
          session_id: str | None = None
  protocols:
    RecoveryCoordinator: |
      class RecoveryCoordinator(Protocol):
          def decide_recovery(
              self,
              *,
              request: RecoveryCoordinationInput,
          ) -> RecoveryDecisionSnapshot: ...

event_projection_requirements:
  recovery_event_alignment:
    event_name: "RECOVERY"
    required_fields:
      - type
    recommended_additive_fields:
      - step_id
      - runner_name
      - reason
      - severity
      - liveness_classification
      - continuity_compatibility
      - requires_planner_dispatch
      - fallback_runner
      - session_id
  fallback_event_alignment:
    event_name: "RUNNER_FALLBACK"
    required_fields:
      - from_runner
      - to_runner
      - reason
      - step_id
    projection_rule: "A fallback decision MUST project to RUNNER_FALLBACK when and only when decision_type=fallback_runner."

boundaries_and_constraints:
  - "This contract owns recovery decision observability, not durable continuity storage and not subprocess transport control."
  - "Runtime recovery MUST consume continuity facts; it MUST NOT redefine replay-safety or capability truth already owned by runner_continuity contracts."
  - "RecoveryCoordinator is advisory/decision-producing; loop.py remains the executor of dispatch, halt, fallback, and event emission side effects."
  - "Fallback may switch runner identity only through RecoveryDecisionSnapshot.decision_type=fallback_runner; runner-bound session identity remains non-portable across runners."
  - "Recovery decisions must record reasoned basis, not merely side effects, so operator/audit surfaces can distinguish crash handling from planner remediation."
  - "This contract does not override startup recovery authority; startup recovery remains the pre-loop continuity boundary already pinned in existing contracts."

invariants:
  - "Each recovery decision is derived from exactly one normalized liveness classification plus one continuity compatibility input."
  - "`requires_planner_dispatch=true` implies decision_type is `planner_replan` or `await_judgment`."
  - "`fallback_runner` is populated if and only if decision_type is `fallback_runner`."
  - "A `halt` decision is valid only when the normalized inputs indicate that retry/fallback is contractually blocked or unsafe."

out_of_scope:
  - "Fallback selection algorithm"
  - "Durable persistence of recovery decisions"
  - "Watchdog implementation details"
  - "Any production code or behavior change in this step"
