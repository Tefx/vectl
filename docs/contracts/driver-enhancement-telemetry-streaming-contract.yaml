# Driver Enhancement Telemetry Streaming Contract
# Source step: driver-enhancement-foundation.contract
# Scope: Pin streaming-aware telemetry contracts for runner heartbeat/progress and planner dispatch snapshots.

metadata:
  contract_id: driver-enhancement-telemetry-streaming-contract
  version: "1.0.0"
  status: proposed
  created: 2026-03-29
  owner_step: driver-enhancement-foundation.contract

sources:
  - "docs/contracts/driver-enhancement-architecture-basis.yaml#source_of_truth_matrix"
  - "docs/contracts/driver-enhancement-architecture-basis.yaml#runtime_contract"
  - "docs/contracts/driver-enhancement-architecture-basis.yaml#transport_boundary_rules"
  - "docs/contracts/driver-enhancement-architecture-basis.yaml#shared_abstractions"
  - "docs/DRIVER-ARCHITECTURE.md#1-2-dependency-direction-rules"
  - "src/vectl/driver/runners.py (RunnerHandle, Runner)"
  - "src/vectl/driver/types.py (RunnerResult, RunningEntry, RunnerStatus)"
  - "src/vectl/driver/events/registry.py (PLANNER_DISPATCH_* ownership and payload requirements)"
  - "src/vectl/driver/events/types.py (canonical event envelope)"

authoritative_sources:
  architecture_basis_sections:
    - "source_of_truth_matrix.concern=runner lifecycle observability snapshots"
    - "source_of_truth_matrix.concern=planner dispatch audit facts"
    - "runtime_contract.observability_contract"
    - "runtime_contract.streaming_aware_liveness"
    - "transport_boundary_rules"
    - "shared_abstractions.shared_types.RunnerHeartbeatSnapshot"
    - "shared_abstractions.shared_types.RunnerProgressSnapshot"
    - "shared_abstractions.shared_types.PlannerDispatchSnapshot"
    - "shared_abstractions.shared_protocols.StreamProgressSource"
  rationale: >-
    The architecture basis assigns enhancement-wave runner lifecycle observability to
    a dedicated shared contract surface so loop.py, liveness, and event emission do not
    invent competing heartbeat/progress schemas.

ownership:
  owner_module: "src/vectl/driver/observability_contracts.py"
  adjacent_modules:
    stream_reader_protocol_owner: "src/vectl/driver/streaming.py"
    event_schema_owner: "src/vectl/driver/events/registry.py"
    orchestration_authority: "src/vectl/driver/loop.py"
  primary_consumers:
    - "src/vectl/driver/streaming.py"
    - "src/vectl/driver/liveness.py"
    - "src/vectl/driver/loop.py"
    - "src/vectl/driver/events/emitter.py"

exact_signatures:
  type_aliases:
    RunnerTelemetryPhase: 'Literal["dispatch_accepted", "heartbeat", "progress", "terminal"]'
    StreamChannel: 'Literal["stdout", "stderr", "control", "synthetic"]'
    PlannerDispatchPhase: 'Literal["started", "completed", "failed"]'
  dataclasses:
    RunnerHeartbeatSnapshot: |
      @dataclass(frozen=True)
      class RunnerHeartbeatSnapshot:
          step_id: str
          runner_name: str
          phase: RunnerTelemetryPhase
          observed_at: float
          dispatched_at: float
          pid: int | None
          session_id: str | None
          sequence: int
          channel: StreamChannel
    RunnerProgressSnapshot: |
      @dataclass(frozen=True)
      class RunnerProgressSnapshot:
          step_id: str
          runner_name: str
          observed_at: float
          dispatched_at: float
          pid: int | None
          session_id: str | None
          sequence: int
          channel: StreamChannel
          message: str | None
          progress_current: float | None
          progress_total: float | None
          progress_unit: str | None
    PlannerDispatchSnapshot: |
      @dataclass(frozen=True)
      class PlannerDispatchSnapshot:
          step_id: str
          trigger: str
          judgment_type: str
          runner: str
          phase: PlannerDispatchPhase
          observed_at: float
          session_id: str | None
          elapsed_seconds: float | None = None
          status: str | None = None
          output: str | None = None
  protocols:
    StreamProgressSource: |
      class StreamProgressSource(Protocol):
          def latest_heartbeat(self) -> RunnerHeartbeatSnapshot | None: ...
          def latest_progress(self) -> RunnerProgressSnapshot | None: ...
          def stream_key(self) -> str: ...

event_projection_requirements:
  planner_dispatch_alignment:
    started:
      event_name: "PLANNER_DISPATCH_STARTED"
      required_fields:
        - step_id
        - trigger
        - judgment_type
        - runner
      optional_fields:
        - session_id
        - observed_at
    completed:
      event_name: "PLANNER_DISPATCH_COMPLETED"
      required_fields:
        - step_id
        - trigger
        - judgment_type
        - runner
        - session_id
        - elapsed_seconds
      optional_fields:
        - observed_at
    failed:
      event_name: "PLANNER_DISPATCH_FAILED"
      required_fields:
        - step_id
        - trigger
        - judgment_type
        - runner
        - status
        - output
      optional_fields:
        - session_id
        - observed_at
  telemetry_projection_rules:
    - "Heartbeat/progress snapshots MAY project into new enhancement events, but event-name truth remains exclusively in driver.events.registry."
    - "Event envelope shape remains `{ts, event, version, data}` from driver.events.types.Event."
    - "Any new telemetry event fields must be additive optional fields within event-registry compatibility rules."

boundaries_and_constraints:
  - "This contract covers normalized telemetry snapshots only; it does not own subprocess launch, parser terminal-result extraction, or recovery decisions."
  - "loop.py remains start/stop authority for streaming attachment; StreamProgressSource is a read-only observation boundary for downstream consumers."
  - "parsers.py remains terminal-result oriented; incremental stream observation must not be collapsed into parser responsibilities."
  - "Streaming readers may surface heartbeat/progress facts, but MUST NOT trigger planner dispatch, fallback selection, plan mutation, or recovery policy directly."
  - "session_id is runner-bound telemetry metadata and MUST NOT be treated by this contract as portable across runners."
  - "Absence of progress is not a terminal classification inside this contract; it is an input to liveness classification."

invariants:
  - "`sequence` is monotonically increasing per stream_key."
  - "`dispatched_at` is stable for all snapshots emitted from one runner attempt."
  - "Heartbeat and progress are distinct contracts: a heartbeat proves recency of observation; a progress snapshot records useful-forward-progress evidence when available."
  - "PlannerDispatchSnapshot preserves `trigger`, `judgment_type`, `runner`, `session_id` when present, and terminal `elapsed_seconds` when known."

out_of_scope:
  - "Streaming reader implementation strategy (stdout lines vs callbacks vs parser-native hooks)"
  - "Concrete event-name additions in driver.events.registry"
  - "Watchdog thresholds and timeout configuration"
  - "Any implementation code or runtime behavior changes in this step"
