# Driver Routing Hardening Contract
# Source step: driver-routing-hardening.contract
# Scope: Pin invalid `agent_routing.default` semantics and validation timing.

metadata:
  contract_id: driver-routing-hardening-contract
  version: "1.0.0"
  status: proposed
  created: 2026-03-29
  owner_step: driver-routing-hardening.contract

sources:
  - "src/vectl/driver/config.py (DriverConfig.agent_routing, DriverConfig.fallback_runner, route_agent)"
  - "docs/DRIVER-ARCHITECTURE.md#2-3-config-py-configuration"
  - "driver.yaml#agent-routing-and-fallback-runner"
  - "README.md#Programmatic Driver"

authoritative_interface:
  config_surface: "DriverConfig.agent_routing + DriverConfig.fallback_runner"
  resolver_surface: "DriverConfig.route_agent(agent: str) -> str"

routing_semantics:
  supported:
    - name: exact_match
      description: "If `agent` exists as a literal key in `agent_routing`, route to that runner."
    - name: glob_match
      description: "If no exact match exists, evaluate `agent_routing` keys as fnmatch patterns; first matching pattern routes."
    - name: fallback_runner
      description: "If no exact/glob mapping matches, route to `fallback_runner`."
  unsupported:
    - key: "agent_routing.default"
      reason: "Default routing is modeled exclusively by `fallback_runner`, not by a reserved routing key."

validation_contract:
  rejection_timing: "config validation (load-time), never runtime routing"
  required_behavior:
    - "Configuration containing `agent_routing.default` MUST be rejected."
    - "Rejection MUST happen in DriverConfig validation/load_config path before any dispatch loop executes."
    - "route_agent() MUST NOT contain runtime special-casing for a `default` key."

required_user_facing_error:
  message: >-
    Invalid configuration in <path>: agent_routing.default is not supported. Remove
    agent_routing.default and use explicit exact/glob entries in agent_routing plus
    fallback_runner for default routing behavior.
  guidance_requirements:
    - "Name the invalid key exactly: agent_routing.default"
    - "State this is a configuration error"
    - "Instruct users to use exact/glob entries and fallback_runner"

examples:
  valid:
    - |
      agent_routing:
        python-senior: claude
        "*-tester": opencode
      fallback_runner: opencode
  invalid:
    - |
      agent_routing:
        default: opencode
      fallback_runner: opencode

out_of_scope:
  - "Runtime behavior changes outside validation/routing contract"
  - "Runner selection policy beyond exact/glob/fallback semantics"
  - "Changes to production code in this contract step"
