plan_path: plan.yaml

planner:
  runner: opencode
  external_agent_name: vectl-planner-slim

runners:
  opencode:
    command: opencode
    args: ["run", "--format", "json"]
    stall_timeout: 300
    output_parser: opencode_jsonl
    persist_session: true
    supports_agent_selection: true
  codex:
    command: codex
    args: ["exec", "--json", "--dangerously-bypass-approvals-and-sandbox", "-C", "{workdir}"]
    prompt_mode: stdin_dash
    stall_timeout: 300
    resume_command: ["codex", "exec", "resume", "--json", "--dangerously-bypass-approvals-and-sandbox"]
    session_id_regex: "^[0-9a-f]{8}-"
    output_parser: codex_jsonl
    supports_agent_selection: false

fallback_runner: opencode

orchestration:
  max_parallelism: 1
  merge_strategy: squash

session:
  reuse_ttl: 300

judge:
  runner: codex
  external_agent_name: null
  structured_output: true
  preflight: true
  evidence_validation: true
  failure_classification: true
  escalation: true
  gate_assessment: true
  cold_context: true
  anomaly: true

observability:
  events_file: .vectl/driver-events.jsonl
  log_level: INFO
  print_progress: true
  cost_tracking: true
