proof_register:
  remediation_batch:
    step_id: orch_operator_deep_review.fix_behavioral_conformance_blockers
    source_report: .vectl/worktrees/orch_operator_deep_review.spec_conformance_full/spec_conformance_full_report.yaml
    source_root_cause: "R19 and R24 remained NEEDS_TEST due to missing executable runtime proof"
  requirements:
    - requirement_ref: R19
      behavior_claim: "Resolver gateway enforces deny-by-default allowlist at runtime and blocks invocation when family is outside the per-call allowlist snapshot."
      runtime_proof_expected: "Same planned tool call with identical gateway is denied for allowlist=() and succeeds for allowlist=('core',), proving behavior varies with allowlist input."
      evidence_ref:
        - tests/orchestration/unit/test_resolver_gateway.py::test_allowlist_runtime_enforcement_varies_with_snapshot
      status: PROVEN
      closure_path: "Focused runtime unit proof exercising authorize_and_invoke deny/allow paths with execution counter guard."
      gate_decision_basis: "Proof demonstrates both denial reason_code=family_not_allowed and successful invocation only after allowlist expansion; obligation moved from NEEDS_TEST to PROVEN."
      gate_open_allowed: true
    - requirement_ref: R24
      behavior_claim: "Roster claim() returning None indicates no reusable resource and is not interpreted by control as plan blockage."
      runtime_proof_expected: "When roster.claim('python-executor') returns None and core has claimable work, control still emits dispatch (fallback role) rather than resolve/blocked flow."
      evidence_ref:
        - tests/orchestration/unit/test_control.py::test_roster_none_claim_is_not_interpreted_as_plan_blockage
      status: PROVEN
      closure_path: "Focused runtime unit proof combining real Roster claim(None) outcome with PlanAwareControl evaluation path."
      gate_decision_basis: "Control decision remains dispatch under claimable core state after None claim, proving no plan-blockage reinterpretation."
      gate_open_allowed: true
  overall:
    batch_status: PROVEN
    gate_open_allowed: true
    gate_decision_basis: "Both blocker-class obligations now have executable runtime proof and explicit gate verdicts; no residual NEEDS_TEST/UNPROVEN status for R19/R24."
