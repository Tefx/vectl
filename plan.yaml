    status: pending
    description: "Refactor the CLI's _load() and _save() functions in src/vectl/cli.py\
      \ to use split state, mirroring the MCP refactor.\n\nCurrent signatures:\n```python\n\
      def _load(plan_path: Path | None) -> tuple[Plan, str, Path]:\n    # returns\
      \ (plan, hash, resolved_path)\n\ndef _save(plan: Plan, plan_path: Path, expected_hash:\
      \ str) -> None:\n    # recalc_lock_status then save_plan\n```\n\nNew signatures:\n\
      ```python\ndef _load(plan_path: Path | None) -> tuple[Plan, str, str, Path]:\n\
      \    \"\"\"Load plan with state.\n    \n    Returns (merged_plan, def_hash,\
      \ state_hash, resolved_plan_path).\n    \n    Strategy (mirrors MCP _load):\n\
      \    1. Resolve plan path, load plan definition\n    2. Resolve state path via\
      \ resolve_state_path(target)\n    3. Load state if exists, merge into plan\n\
      \    4. If no state file, return plan as-is with '' state hash\n    \"\"\"\n\
      \ndef _save_state(plan: Plan, plan_path: Path, expected_state_hash: str) ->\
      \ None:\n    \"\"\"Save only state to state.json.\n    \n    1. Resolve state\
      \ path from plan_path\n    2. Extract state via extract_state(plan)\n    3.\
      \ Save via save_state() with CAS\n    4. Print lock notice if any\n    \"\"\"\
      \n\ndef _save_definition(plan: Plan, plan_path: Path, expected_def_hash: str)\
      \ -> None:\n    \"\"\"Save only definition to plan.yaml (stripped of state).\n\
      \    \n    1. Strip state from plan\n    2. recalc_lock_status on the full (merged)\
      \ plan first\n    3. Save stripped plan to plan.yaml with CAS\n    4. Print\
      \ lock notice if any\n    \"\"\"\n\ndef _save_both(plan: Plan, plan_path: Path,\
      \ expected_def_hash: str, expected_state_hash: str) -> None:\n    \"\"\"Save\
      \ both definition and state.\"\"\"\n```\n\nNew imports needed in cli.py:\n-\
      \ from vectl.plan_path import resolve_state_path\n- from vectl.io import load_state,\
      \ save_state, merge_plan, extract_state, strip_state\n\nNote: The CLI already\
      \ has error handling for CASConflictError in _save() -- replicate this pattern\
      \ in the new functions (catch CASConflictError and call _die()).\n\nFile: src/vectl/cli.py\n\
      Pattern: Mirror the MCP server's load/save pattern but with CLI-specific error\
      \ handling (console.print, _die())"
