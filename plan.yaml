  steps:
  - id: ss-io.state-path
    name: state-path
    status: pending
    description: "Add resolve_state_path() function to src/vectl/plan_path.py.\n\n\
      New function:\n```python\ndef resolve_state_path(plan_path: Path | None = None)\
      \ -> Path:\n    \"\"\"Resolve the state.json path for a given plan.\n    \n\
      \    Resolution strategy:\n    1. Find the git common dir via: git rev-parse\
      \ --git-common-dir\n       - Run from the directory containing plan.yaml (or\
      \ cwd)\n       - If successful: return <git-common-dir>/vectl/state.json\n \
      \   2. Non-git fallback: return <plan_dir>/.vectl/state.json\n    \n    The\
      \ git-common-dir approach ensures worktrees share state.\n    \"\"\"\n```\n\n\
      Implementation details:\n- Use subprocess.run(['git', 'rev-parse', '--git-common-dir'],\
      \ ...) with capture_output=True\n- Run it with cwd set to the directory of the\
      \ resolved plan path (use resolve_plan_path() if plan_path is None)\n- If git\
      \ command succeeds (returncode == 0): Path(stdout.strip()) / 'vectl' / 'state.json'\n\
      - If git command fails (not a git repo): plan_path.parent / '.vectl' / 'state.json'\n\
      - Do NOT create directories -- that is the caller's responsibility (save_state\
