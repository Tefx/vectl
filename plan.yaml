- id: dg-remediation
  name: Divergence Guard Gate Remediation
  status: pending
  steps:
  - id: dg-remediation.wire-backup-into-save
    name: wire-backup-into-save
    status: pending
    description: "BLOCKING-1: Wire `_backup_definition()` into both save paths so\
      \ backups are actually created.\n\nThe function `_backup_definition()` at `src/vectl/io.py:428`\
      \ exists but is never called from any save path, making the entire backup/recovery\
      \ pipeline non-functional.\n\n## Changes Required\n\n### 1. `src/vectl/cli.py`\
      \ — `_save_definition()` (line 222)\nAfter the successful `save_plan()` call\
      \ at line 228, add a try/except block that calls `_backup_definition(plan_path)`.\
      \ Errors must be logged to stderr via `console.print()` but must NOT raise or\
      \ block the save.\n\n```python\n# After line 228: save_plan(stripped, plan_path,\
      \ expected_hash=expected_def_hash)\ntry:\n    from vectl.io import _backup_definition\n\
      \    _backup_definition(plan_path)\nexcept Exception as exc:\n    import sys\n\
      \    print(f\"Warning: backup failed: {exc}\", file=sys.stderr)\n```\n\n###\
      \ 2. `src/vectl/mcp_server.py` — `_save_definition()` (line 186)\nAfter the\
      \ successful `save_plan()` call at line 194, add an equivalent try/except block:\n\
      \n```python\n# After line 194: save_plan(stripped, _plan_path(), expected_def_hash)\n\
      try:\n    from vectl.io import _backup_definition\n    _backup_definition(_plan_path())\n\
      except Exception:\n    pass  # MCP: silently ignore backup failures\n```\n\n\
      ## Out of Scope\n- Modifying `_backup_definition()` itself (that is covered\
      \ by SHOULD_FIX-3 step)\n- Wiring into `_save_both()` or `_save_state()` (backup\
      \ is definition-layer only)\n\n## Tests\n- Add test in `tests/test_io.py`: mock\
      \ `save_plan`, call `_save_definition`, assert `_backup_definition` was invoked\n\
      - Add test: when `_backup_definition` raises OSError, `_save_definition` still\
      \ completes without error\n- Existing `test_backup_definition_*` tests in `tests/test_io.py`\
      \ remain valid"
    verification: '- `grep -n ''_backup_definition'' src/vectl/cli.py src/vectl/mcp_server.py`
      shows calls in both _save_definition functions

      - pytest tests/test_io.py -v -k backup passes

      - New test proves backup failure does not block save

      - ruff check src/vectl/cli.py src/vectl/mcp_server.py passes'
    refs:
    - src/vectl/cli.py:222-238
    - src/vectl/mcp_server.py:186-200
    - src/vectl/io.py:428-452
    agent: python-executor
  - id: dg-remediation.fix-recover-confirmation-order
    name: fix-recover-confirmation-order
    status: pending
    description: "BLOCKING-2: Split `recover_from_backup()` so preview happens BEFORE\
      \ overwrite.\n\nCurrently `recover_from_backup()` at `src/vectl/core.py:2541`\
      \ calls `save_plan()` immediately, and CLI's confirmation prompt at `cli.py:1508`\
      \ happens AFTER the restore. The plan is already overwritten before the user\
      \ can decline.\n\n## Changes Required\n\n### 1. `src/vectl/core.py` — Split\
      \ `recover_from_backup()` into two functions\n\n**a) `preview_recovery(plan_path,\
      \ backup_path) -> RecoverResult`**\n- Load backup plan (line 2530)\n- Load current\
      \ plan (line 2537)\n- Compute diff (line 2538)\n- Build summary (lines 2543-2558)\n\
      - Return RecoverResult with `restored=False` (preview only, nothing written)\n\
      - Do NOT call `save_plan()`\n\n**b) `apply_recovery(backup_path, plan_path)\
      \ -> None`**\n- Load backup plan\n- Call `save_plan(backup_plan, plan_path)`\n\
      - This is the destructive operation, called only after user confirms\n\nKeep\
      \ the original `recover_from_backup()` as a convenience wrapper that calls both\
      \ (for MCP and `--yes` paths).\n\n### 2. `src/vectl/cli.py` — Update `recover`\
      \ command (lines 1492-1514)\n\nReplace the current flow:\n```python\n# OLD:\
      \ result = recover_from_backup(plan_path, backup_path)  # writes!\n#      show\
      \ diff\n#      ask confirmation  # too late!\n\n# NEW:\nresult = preview_recovery(plan_path,\
      \ backup_path)  # read-only\nout.print(\"[bold]Recovery diff:[/]\")\nout.print(result.diff_summary)\n\
      if not yes:\n    confirm = typer.prompt(\"Restore plan.yaml from backup? (y/N)\"\
      , default=\"n\")\n    if confirm.lower() != \"y\":\n        out.print(\"[yellow]Cancelled.[/]\"\
      )\n        return\napply_recovery(backup_path, plan_path)\nout.print(\"[green]Plan\
      \ restored from backup.[/]\")\n```\n\n### 3. `src/vectl/mcp_server.py` — Update\
      \ `vectl_recover` tool\nThe MCP recover tool should also use the split API.\
      \ If it auto-applies (no interactive prompt), it can call `recover_from_backup()`\
      \ directly (the wrapper).\n\n## Failure-mode checklist\n- CAS conflict during\
      \ apply_recovery: should raise, user retries\n- Backup file deleted between\
      \ preview and apply: apply_recovery raises PlanIOError\n- Concurrent modification\
      \ between preview and apply: CAS in save_plan catches it\n\n## Tests\n- Update\
      \ existing `test_recover_*` tests to cover the split API\n- Add test: `preview_recovery`\
      \ does NOT modify plan.yaml (read file before/after, assert identical)\n- Add\
      \ test: `apply_recovery` writes the backup content\n- Add test: full flow preview\
      \ -> confirm -> apply works end-to-end"
    verification: '- preview_recovery() does not write to disk (test asserts file
      unchanged)

      - apply_recovery() writes backup content correctly

      - CLI recover command asks confirmation BEFORE any write

