# =============================================================
# MANAGED FILE — DO NOT EDIT DIRECTLY
# This file is owned by vectl. Direct edits bypass CAS write
# protection, lock recalculation, and schema validation.
#
# Use: uvx vectl <command>  OR  vectl_* MCP tools
# Docs: uvx vectl guide
# =============================================================
version: 1
project: vectl
strategy_ref: tools/vectl/README.md
context: 'Bootstrapping vectl development.

  PHILOSOPHY: Clean code, comprehensive tests, self-hosting.

  METHODOLOGY: Models → IO → Logic → CLI → MCP.

  CONSTRAINT: Zero imports from eidos-*. Pure standalone tool.

  '
phases:
- id: core
  name: Core Logic
  status: pending
  gate: All core unit tests pass
  context: 'Foundation layer. Pydantic models, atomic YAML IO,

    DAG validation, state machine, and query logic.

    Everything else builds on this.

    '
  steps:
  - id: core.1
    name: Pydantic Data Models
    status: pending
    description: 'Define all data models in core.py:

      - StepStatus enum (pending, claimed, done, skipped, rejected)

      - PhaseStatus enum (locked, pending, in_progress, done)

      - RejectionEntry model

      - Step model (with model_validator for skipped/rejected reasons)

      - Phase model (with depends_on for DAG)

      - Plan model (with context and strategy_ref)

      '
    verification: uv run pytest tools/vectl/tests/test_models.py -v
    refs:
    - tools/vectl/README.md
  - id: core.2
    name: YAML IO with CAS
    status: pending
    description: 'Implement in core.py:

      - load_plan(path) -> Plan: Read YAML, parse to Pydantic

      - save_plan(plan, path): Atomic write (temp file + rename)

      - CAS check: hash before read, verify before write, retry 3x

      Ensure round-trip fidelity (load → save → load == identical).

      '
    verification: uv run pytest tools/vectl/tests/test_io.py -v
    depends_on:
    - core.1
  - id: core.3
    name: DAG Validation
    status: pending
    description: "Implement in core.py:\n- validate_plan(plan) -> list[Error]:\n \
      \ - Phase DAG: cycle detection, valid depends_on refs\n  - Step DAG: cycle detection\
      \ within phase, valid depends_on refs\n  - ID uniqueness (phase IDs, step IDs\
      \ within phase)\n  - Status consistency (no done step in locked phase, etc.)\n\
      \  - Skipped/rejected reason enforcement\n- Spec anchor check: verify files\
      \ in refs[] exist on disk\n"
    verification: uv run pytest tools/vectl/tests/test_validation.py -v
    depends_on:
    - core.1
  - id: core.4
    name: State Machine & Query Logic
    status: pending
    description: "Implement in core.py:\n- get_next_steps(plan) -> list[Step]:\n \
      \ Find all claimable steps across active phases.\n  Respect phase DAG (locked\
      \ phases excluded).\n  Respect step DAG (blocked steps excluded).\n  Highlight\
      \ rejected steps with priority.\n- claim_step(plan, step_id, agent_name) ->\
      \ Plan:\n  Validate step is claimable. Set status, claimed_by, claimed_at.\n\
      - complete_step(plan, step_id, evidence) -> Plan:\n  Validate step is claimed.\
      \ Set status, evidence.\n  Auto-update phase status if all steps done.\n- defer_step(plan,\
      \ step_id) -> Plan:\n  Return to pending. Clear claimed_by/at.\n- reject_step(plan,\
      \ step_id, reason, reviewer) -> Plan:\n  Set rejected status. Append to rejection_history.\n\
      - skip_step(plan, step_id, reason) -> Plan:\n  Set skipped with reason.\n"
    verification: uv run pytest tools/vectl/tests/test_logic.py -v
    depends_on:
    - core.2
    - core.3
  - id: core.5
    name: Checklist Operations
    status: pending
    description: "Implement in core.py:\n- update_checklist(plan, step_id, check=None,\
      \ append=None) -> Plan:\n  If check: fuzzy match checklist item in description,\
      \ toggle [x].\n  If append: add new \"- [ ] item\" to description.\n  Fuzzy\
      \ match: case-insensitive substring match on item text.\n  If multiple matches,\
      \ raise AmbiguousMatch with candidates.\n  If no match, raise NoMatch with suggestion\
      \ to use --append.\n"
    verification: uv run pytest tools/vectl/tests/test_checklist.py -v
    depends_on:
    - core.2
- id: cli_read
  name: CLI Read Commands
  status: pending
  gate: All CLI read commands work against real plan.yaml
  context: 'Read-only CLI using Typer + Rich.

    After this phase, agents can query the plan but not modify it.

    '
  depends_on:
  - core
  steps:
  - id: cli.1
    name: CLI Scaffold + Init
    status: pending
    description: 'Create cli.py with Typer app.

      Implement: vectl init

      - Creates plan.yaml with project name prompt

      - Generates minimal valid template

      Implement: vectl --version

      '
    verification: vectl init --help && vectl --version
  - id: cli.2
    name: Next Command
    status: pending
    description: 'Implement: vectl next

      - Load plan.yaml from current directory (or --plan flag)

      - Call get_next_steps()

      - Print strategy context (from plan.context)

      - Print available steps with phase info

      - Highlight rejected steps in red

      - Warn about stale claimed steps

      '
    verification: vectl next (against tools/vectl/plan.yaml)
    depends_on:
    - cli.1
  - id: cli.3
    name: Status Command
    status: pending
    description: 'Implement: vectl status

      - Show all phases with progress bars

      - Show phase DAG (which depends on which)

      - Show locked/unlocked status

      Implement: vectl status --phase <id>

      - Show detailed step list for one phase

      '
    verification: vectl status (against tools/vectl/plan.yaml)
    depends_on:
    - cli.1
  - id: cli.4
    name: Help-Agent Command
    status: pending
    description: 'Implement: vectl help-agent [--context startup|rejection|planning]

      - startup: Check-in workflow (next → claim → work → complete)

      - rejection: How to handle rejected steps

      - planning: How to add/modify steps (architect workflow)

      Default (no context): show startup guide

      '
    verification: vectl help-agent --context startup
    depends_on:
    - cli.1
- id: cli_write
  name: CLI Mutation Commands
  status: pending
  gate: 'Bootstrap achieved: vectl manages its own plan.yaml'
  context: 'Write commands. After this phase, vectl is self-hosting.

    This is the bootstrap milestone.

    '
  depends_on:
  - cli_read
  steps:
  - id: cli.5
    name: Claim & Complete
    status: pending
    description: 'Implement: vectl claim <step_id> [--agent <name>]

      Implement: vectl complete <step_id> --evidence <text>

      Both use atomic save (CAS).

      '
    verification: vectl claim core.1 --agent test && vectl defer core.1
  - id: cli.6
    name: Defer, Reject, Skip
    status: pending
    description: 'Implement: vectl defer <step_id>

      Implement: vectl reject <step_id> --reason <text> [--reviewer <name>]

      Implement: vectl complete <step_id> --skip --reason <text>

      '
    verification: uv run pytest tools/vectl/tests/test_cli.py -v
    depends_on:
    - cli.5
  - id: cli.7
    name: Update Checklist
    status: pending
    description: 'Implement: vectl update-checklist <step_id> --check <keyword>

      Implement: vectl update-checklist <step_id> --append <text>

      Uses fuzzy matching from core.

      '
    verification: uv run pytest tools/vectl/tests/test_cli.py -v
    depends_on:
    - cli.5
  - id: cli.8
    name: Validate Command
    status: pending
    description: 'Implement: vectl validate

      - Run all validation checks from core

      - Print pass/fail/warning summary

      - Exit code 0 if valid, 1 if errors

      '
    verification: vectl validate (against tools/vectl/plan.yaml)
- id: cli_architect
  name: CLI Architect Commands
  status: pending
  gate: Architect can fully manage plan structure via CLI
  depends_on:
  - cli_write
  steps:
  - id: arch.1
    name: Add Step & Add Steps (Bulk)
    status: pending
    description: "Implement: vectl add-step --phase <id> --name <n> --description\
      \ <d>\n  [--depends-on <ids>] [--verification <cmd>] [--refs <refs>]\nImplement:\
      \ vectl add-steps --phase <id> (reads simplified YAML from stdin)\nAuto-generate\
      \ step IDs.\n"
    verification: uv run pytest tools/vectl/tests/test_architect.py -v
  - id: arch.2
    name: Edit, Remove, Move Step
    status: pending
    description: 'Implement: vectl edit-step <id> [--name] [--description] [--add-dep]
      [--remove-dep]

      Implement: vectl remove-step <id> (only pending steps)

      Implement: vectl move-step <id> --to-phase <phase_id>

      '
    verification: uv run pytest tools/vectl/tests/test_architect.py -v
    depends_on:
    - arch.1
  - id: arch.3
    name: Add Phase & Unlock
    status: pending
    description: "Implement: vectl add-phase --name <n> [--depends-on <ids>] [--gate\
      \ <text>]\nImplement: vectl unlock <phase_id> [--evidence <text>]\n  Validates\
      \ all depends_on phases are done.\n"
    verification: uv run pytest tools/vectl/tests/test_architect.py -v
  - id: cli_architect.bulk-add-steps-from-stdin
    name: bulk add-steps from stdin
    status: pending
    description: vectl add-steps --phase <id> reads simplified YAML from stdin. Deferred
      from arch.1 scope.
    depends_on:
    - arch.2
  - id: cli_architect.unlock-command
    name: unlock command
    status: pending
    description: vectl unlock <phase_id> --evidence <text>. Validates all depends_on
      phases are done. Deferred from arch.3 scope.
    depends_on:
    - arch.2
- id: review
  name: Review & Gate Commands
  status: pending
  gate: Review output matches design spec
  depends_on:
  - cli_write
  steps:
  - id: rev.1
    name: Review Command
    status: pending
    description: 'Implement: vectl review [--phase <id>] [--all]

      Output layers:

      - L1: Automated checks (validate results)

      - L2: Phase overview with progress

      - L3: Active phase detail (steps, deps, refs)

      - L4: Spec coverage (reverse index from refs)

      '
    verification: vectl review (against tools/vectl/plan.yaml)
  - id: rev.2
    name: Gate Check Command
    status: pending
    description: 'Implement: vectl gate-check <phase_id>

      - Check all steps done/skipped

      - Run gate_script if defined (subprocess, check exit code)

      - Print manual gate criteria

      - Recommend unlock if all pass

      '
    verification: uv run pytest tools/vectl/tests/test_gate.py -v
- id: mcp
  name: MCP Server
  status: pending
  gate: MCP tools callable from agent environment
  depends_on:
  - cli_architect
  - command-enrichment
  steps:
  - id: mcp.1
    name: FastMCP Server
    status: pending
    description: 'Implement mcp_server.py using fastmcp.

      Expose all core functions as MCP tools.

      Each tool returns Markdown-formatted text.

      Tool names: vectl_next, vectl_claim, vectl_complete, etc.

      '
    verification: uv run pytest tools/vectl/tests/test_mcp.py -v
- id: migrate
  name: Eidos Migration
  status: pending
  gate: Eidos agents use vectl for all plan management
  context: 'Migrate Eidos from IMPLEMENTATION-PLAN.md to plan.yaml.

    This is the real-world validation of vectl.

    '
  depends_on:
  - cli_architect
  steps:
  - id: mig.1
    name: Create Eidos plan.yaml
    status: pending
    description: 1. Run `vectl init --project Eidos` (creates plan.yaml template +
      appends AGENTS.md with vectl section). 2. Manually read IMPLEMENTATION-PLAN.md
      section by section, populate plan.yaml via add-phase/add-step or direct edit.
      3. Extract Stub Manifest from IMPLEMENTATION-PLAN.md to docs/STUB-MANIFEST.md.
      No migration script (one-time operation, format too irregular for parser). Drop
      Testing Strategy section entirely — conflicts with AGENTS.md Evidence Ladder
      (L1-L3) and Test Tiers, directory listing is stale, CI matrix is aspirational.
      IMPLEMENTATION-PLAN.md is NOT modified. Human review the generated plan.
    verification: vectl validate && vectl status
  - id: mig.2
    name: Content quality review of generated plan.yaml
    status: pending
    description: 'Review generated plan.yaml for content quality. Checklist: (1) Phase
      count matches IMPLEMENTATION-PLAN.md, (2) Step count matches (~89 rows), (3)
      Dependencies preserved (Blocking column -> depends_on), (4) Phase boundaries
      correct, (5) Stub Manifest extracted to docs/STUB-MANIFEST.md, (6) No semantic
      information lost (except intentionally dropped Testing Strategy). Tool functionality
      already covered by 523 automated tests — no manual CLI/MCP stress testing needed.
      Decision gate: human decides if plan.yaml is ready for mig.3/mig.4.'
    verification: vectl validate && vectl review
    depends_on:
    - mig.1
  - id: mig.3
    name: Clean up AGENTS.md prohibition
    status: pending
    description: 'Delete the prohibition line (L191: "Do NOT use tools/vectl/") from
      AGENTS.md. The vectl usage section is already appended by vectl init in mig.1.'
    verification: '! grep ''Do NOT use tools/vectl'' AGENTS.md && grep ''Plan Tracking
      (vectl)'' AGENTS.md'
    depends_on:
    - mig.1
  - id: mig.4
    name: Rewrite IMPLEMENTATION-PLAN.md references in AGENTS.md
    status: pending
    description: 'Replace 13 IMPLEMENTATION-PLAN.md references in AGENTS.md. Four
      categories:


      A) Pointer swaps (L33, L77, L134, L737): "IMPLEMENTATION-PLAN.md" or implicit
      "the plan" -> "plan.yaml (via vectl status/show)".


      B) Process swaps (L130, L401): L130: "see Guardrails in IMPLEMENTATION-PLAN.md"
      -> "gate criteria visible via vectl show <phase>" (gate review = invoke eidos-gate-reviewer,
      NOT automated command). L401: "Create a task in IMPLEMENTATION-PLAN.md" -> "vectl
      add-step --phase-id <id> --name <name>".


      C) Section deletions (L205-225): Delete "Table Editing Protocol" + "Checkpoint"
      subsections — taught agents to edit markdown tables, obsolete with vectl.


      D) Retrofit template fixes (L359, L568, L692, L697): L359: "add entry to IMPLEMENTATION-PLAN.md
      Stub Manifest" -> "add entry to docs/STUB-MANIFEST.md". L568, L692, L697: "Tracked:
      IMPLEMENTATION-PLAN.md Phase X" -> "Tracked: plan.yaml step <id>".


      Historical audit docs (docs/IRR-RETROACTIVE-AUDIT.md etc.) are NOT modified
      — dated references are historical fact.'
    verification: '! grep "IMPLEMENTATION-PLAN.md" AGENTS.md && grep "plan.yaml" AGENTS.md
      && grep "vectl" AGENTS.md | wc -l && test -f docs/STUB-MANIFEST.md'
    depends_on:
    - mig.2
    - mig.3
  - id: mig.5
    name: Archive IMPLEMENTATION-PLAN.md
    status: pending
    description: Move docs/IMPLEMENTATION-PLAN.md to docs/_archive/IMPLEMENTATION-PLAN.md.
      Verify vectl status still works against plan.yaml. plan.yaml becomes single
      source of truth.
    verification: test -f docs/_archive/IMPLEMENTATION-PLAN.md && test ! -f docs/IMPLEMENTATION-PLAN.md
      && vectl status
    depends_on:
    - mig.4
- id: cli-ux-enhancements
  name: CLI UX Enhancements
  status: pending
  depends_on:
  - cli_write
  steps:
  - id: cli-ux-enhancements.show-command
    name: show command
    status: pending
    description: 'Universal inspect: vectl show <id> works for both steps (id contains
