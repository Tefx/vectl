      \ objects, keyed by their IDs.\n    \n    Returns PlanState with:\n    - plan_id:\
      \ plan.plan_id or '' if not set\n    - steps: {step.id: StepState(status=step.status,\
      \ claimed_by=..., ...)} for all steps\n    - phases: {phase.id: PhaseState(status=phase.status,\
      \ evidence=phase.evidence)} for all phases\n    - clipboard: plan.clipboard\n\
      \    \"\"\"\n\ndef strip_state(plan: Plan) -> Plan:\n    \"\"\"Return a deep\
      \ copy of plan with all mutable state fields reset to defaults.\n    \n    For\
      \ each step: status=PENDING, claimed_by=None, claimed_at=None, evidence=None,\n\
      \      skipped_reason=None, rejection_reason=None, rejection_history=[], \n\
