      \ onto steps, use step.model_copy(update={...})\n    to ensure the model_validator\
      \ sees consistent field combinations\n    (e.g. status=SKIPPED with skipped_reason\
      \ set together).\n    \"\"\"\n```\n\nKey design invariant:\n  merge_plan(strip_state(plan),\
