- id: clipboard
  name: Clipboard
  status: pending
  gate: All clipboard tests pass, write/read/clear/ttl/checkpoint integration verified
  steps:
  - id: clipboard.clipboard-data-model
    name: Clipboard data model
    status: pending
    description: 'Add Clipboard Pydantic model and Plan.clipboard field per RFC.


      - Clipboard(BaseModel): author (non-empty), summary (str), content (str), written_at
      (ISO 8601), expires_at (ISO 8601)

      - Plan: add clipboard: Clipboard | None = None, declared immediately before
      phases

      - Validate: author non-empty, content non-empty/non-whitespace, summary present

      - YAML round-trip must work (exclude_none=True already handles omission)'
    verification: uv run pytest tests/test_models.py -v -k clipboard
    evidence_template: 'Clipboard model added with fields: author, summary, content,
      written_at, expires_at. Plan.clipboard field before phases. Validation tests
      pass.'
  - id: clipboard.core-clipboard-logic
    name: Core clipboard logic
    status: pending
    description: 'Pure functions for clipboard operations (no IO, no MCP).


      - clipboard_write(plan, author, summary, content, ttl=24) -> Plan: create Clipboard,
      compute expires_at, truncate summary to 80 chars, validate content (non-empty,
      non-whitespace, max 8000 chars), validate author (non-empty). Overwrite any
      existing clipboard.

      - clipboard_read(plan) -> Clipboard | None: return clipboard if present and
      not expired, None otherwise. Pure read.

      - clipboard_clear(plan) -> Plan: set plan.clipboard = None.

      - _clipboard_expired(cb: Clipboard) -> bool: compare expires_at with now(UTC).


      Raise PlanError for validation failures with actionable messages per RFC.'
    verification: uv run pytest tests/test_clipboard.py -v
    evidence_template: 'Core functions: clipboard_write, clipboard_read, clipboard_clear,
      _clipboard_expired. Tests cover: write/overwrite, summary truncation, content
      limit, empty/whitespace rejection, author validation, TTL default + custom,
      expiry boundary.'
    depends_on:
    - clipboard.clipboard-data-model
  - id: clipboard.mcp-vectl-clipboard-tool
    name: MCP vectl_clipboard tool
    status: pending
    description: 'Add vectl_clipboard MCP tool with three actions: write, read, clear.


      - write: params (action, summary, content, author, ttl=24). CAS load/save. Return
      confirmation with summary + expires_at.

      - read: pure read, no CAS. Return content/author/summary/written_at/expires_at.
      Expired → "Clipboard is empty. Note: previous clipboard by {author} expired
      {N}h ago."

      - clear: CAS load/save. Return "Clipboard cleared." or "Clipboard was already
      empty."

      - CAS error message: "Clipboard write conflict — another agent modified the
      plan. Re-read with vectl_status or vectl_show, then retry."

      - Tool description for agent discovery.'
    verification: uv run pytest tests/test_mcp.py -v -k clipboard
    evidence_template: vectl_clipboard tool registered with write/read/clear actions.
      MCP tests cover all actions + CAS conflict + expiry behavior.
    depends_on:
    - clipboard.core-clipboard-logic
  - id: clipboard.checkpoint-clipboard-integration
    name: Checkpoint clipboard integration
    status: pending
    description: 'Surface clipboard summary in vectl_checkpoint output when non-empty
      and unexpired.


      - In build_checkpoint(): if plan.clipboard exists and not expired, add "clipboard"
      key with {author, summary, written_at, expires_at} (no content).

      - Omit clipboard key when empty or expired (token economy).

      - Works in both lite=True and lite=False modes.'
    verification: uv run pytest tests/test_mcp.py -v -k "checkpoint and clipboard"
    evidence_template: Checkpoint includes clipboard summary when present+unexpired,
      omits when empty/expired. Verified in both lite and non-lite modes.
    depends_on:
    - clipboard.core-clipboard-logic
  - id: clipboard.cli-clipboard-commands
    name: CLI clipboard commands
    status: pending
    description: 'Add three flat CLI commands following existing naming convention:


      - vectl clipboard-write --summary "..." --content "..." --author "..." [--ttl
      24]

      - vectl clipboard-read

      - vectl clipboard-clear


      All delegate to core clipboard functions. Use existing _load/_save pattern.

      Follow flat command naming (add-step, edit-step style), not subcommand groups.'
    verification: uv run pytest tests/test_cli.py -v -k clipboard
    evidence_template: CLI commands clipboard-write, clipboard-read, clipboard-clear
      added. Tests cover basic usage, error cases, TTL flag.
    depends_on:
    - clipboard.core-clipboard-logic
  - id: clipboard.integration-tests-and-yaml-round-trip
    name: Integration tests and YAML round-trip
    status: pending
    description: 'End-to-end integration tests:


      - YAML round-trip: write clipboard -> save plan -> load plan -> read clipboard,
      all fields preserved including expires_at

      - Backward compat: plan.yaml without clipboard field loads correctly (clipboard=None)

      - Claim guidance: verify clipboard is NOT present in guidance output

      - CAS concurrent write: two agents write simultaneously, one gets CASConflictError,
      retries, overwrites (expected behavior, not a bug)

      - Full lifecycle: write -> checkpoint shows it -> read -> clear -> checkpoint
