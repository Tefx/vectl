      \   c. Call acquire_claim(step_id, branch, agent, claims_path)\n   d. If acquire\
      \ fails (already claimed by another agent): raise PlanError\n3. Set step.status\
      \ = CLAIMED, step.claimed_by = agent, step.claimed_at = now() (EXISTING behavior\
      \ preserved)\n4. Auto-update phase to in_progress (EXISTING behavior preserved)\n\
      5. Return (plan, ClaimResult) (EXISTING return type preserved)\n\nThe dual-write\
      \ (claims.json + plan model) is intentional:\n- claims.json: ephemeral coordination\
      \ lock (survives git restore)\n- plan.yaml inline status: durable record (committed\
      \ by caller)\n\nIf claims_path is None, skip claims.json operations (backward\
      \ compat for tests that don't set up a git repo).\n\nAffinity logic: UNCHANGED.\
      \ All affinity checks remain as-is.\n\nTests to update in tests/test_core.py:\n\
