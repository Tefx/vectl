      \ status to PENDING,\n    those validators will not fire. But be careful with\
      \ the order of field assignment.\n    Use model_copy(update={...}) on each step\
      \ to atomically set all fields.\n    \"\"\"\n\ndef merge_plan(plan_def: Plan,\
      \ state: PlanState) -> Plan:\n    \"\"\"Merge state into a plan definition,\
