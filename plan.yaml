    description: "Add load_state() and save_state() functions to src/vectl/io.py.\n\
      \nNew functions:\n```python\ndef load_state(path: Path | str) -> tuple[PlanState,\
      \ str]:\n    \"\"\"Load state from JSON file.\n    \n    Returns (PlanState,\
      \ file_hash) for CAS.\n    If file does not exist, returns (empty PlanState\
      \ with plan_id=''), empty-string hash).\n    \"\"\"\n\ndef save_state(\n   \
      \ state: PlanState,\n    path: Path | str,\n    expected_hash: str | None =\
      \ None,\n    max_retries: int = 3,\n) -> str:\n    \"\"\"Save state to JSON\
      \ file atomically with CAS + auto-retry.\n    \n    Args:\n        state: PlanState\
      \ to persist\n        path: Path to state.json\n        expected_hash: Hash\
      \ from load_state for CAS check. None skips CAS.\n        max_retries: Number\
      \ of CAS conflict retries (merge-and-retry strategy)\n    \n    Returns:\n \
      \       New file hash after save.\n    \n    Raises:\n        CASConflictError:\
      \ After max_retries exhausted.\n    \"\"\"\n```\n\nImplementation details for\
      \ save_state:\n- Atomic write: use same tempfile+rename pattern as save_plan()\n\
      - CAS check: compute hash of existing file, compare with expected_hash\n- Auto-retry\
      \ on CAS conflict (up to max_retries):\n  1. Re-read the current state.json\n\
      \  2. Merge: for each step/phase in our state, overwrite the on-disk version\
      \ (last-writer-wins per key)\n  3. Re-attempt atomic write with the new hash\n\
      \  4. If still conflicting after max_retries, raise CASConflictError\n- Create\
      \ parent directories (path.parent.mkdir(parents=True, exist_ok=True)) before\
      \ writing\n- Serialize using state.model_dump(mode='json', exclude_none=True)\n\
      - Use json.dumps with indent=2, ensure_ascii=False for readability\n- Add _STATE_JSON_HEADER\
      \ comment? No -- JSON doesn't support comments. Just write clean JSON.\n\nNew\
      \ imports needed in io.py: import json, and import PlanState from models\nFile:\
      \ src/vectl/io.py\nPattern: Follow existing load_plan/save_plan patterns for\
      \ CAS and atomic write"
    verification: 'L1: unit tests for load_state (file exists, file missing) and save_state
      (basic write, CAS conflict, auto-retry)'
    depends_on:
    - ss-io.state-path
    agent: python-executor
  - id: ss-io.merge-extract-strip
    name: merge-extract-strip
    status: pending
    description: "Add merge_plan(), extract_state(), and strip_state() functions to\
      \ src/vectl/io.py.\n\nNew functions:\n```python\ndef extract_state(plan: Plan)\
      \ -> PlanState:\n    \"\"\"Extract mutable state fields from a Plan into a PlanState.\n\
      \    \n    Iterates all phases and steps, copies mutable fields into\n    StepState/PhaseState\
      \ objects, keyed by their IDs.\n    \n    Returns PlanState with:\n    - plan_id:\
      \ plan.plan_id or '' if not set\n    - steps: {step.id: StepState(status=step.status,\
      \ claimed_by=..., ...)} for all steps\n    - phases: {phase.id: PhaseState(status=phase.status,\
      \ evidence=phase.evidence)} for all phases\n    - clipboard: plan.clipboard\n\
      \    \"\"\"\n\ndef strip_state(plan: Plan) -> Plan:\n    \"\"\"Return a deep\
      \ copy of plan with all mutable state fields reset to defaults.\n    \n    For\
      \ each step: status=PENDING, claimed_by=None, claimed_at=None, evidence=None,\n\
      \      skipped_reason=None, rejection_reason=None, rejection_history=[], \n\
      \      affinity_override=False, affinity_override_by=None, affinity_override_at=None\n\
      \    For each phase: status=PENDING, evidence=None\n    Plan-level: clipboard=None\n\
      \    \n    Uses plan.model_copy(deep=True) to avoid mutating the original.\n\
      \    \n    IMPORTANT: The model_validator on Step requires skipped_reason when\
      \ status=SKIPPED\n    and rejection_reason when status=REJECTED. Since we reset\
      \ status to PENDING,\n    those validators will not fire. But be careful with\
      \ the order of field assignment.\n    Use model_copy(update={...}) on each step\
      \ to atomically set all fields.\n    \"\"\"\n\ndef merge_plan(plan_def: Plan,\
      \ state: PlanState) -> Plan:\n    \"\"\"Merge state into a plan definition,\
      \ producing a fully hydrated Plan.\n    \n    For each step in the plan:\n \
      \     - If state.steps has an entry for step.id, overlay the state fields\n\
      \      - Otherwise keep defaults from the definition\n    For each phase in\
      \ the plan:\n      - If state.phases has an entry for phase.id, overlay status\
      \ + evidence\n    Plan-level:\n      - If state.clipboard is not None, set plan.clipboard\n\
      \      - If state.plan_id is set, set plan.plan_id\n    \n    Uses plan_def.model_copy(deep=True)\
      \ to avoid mutating the original.\n    \n    IMPORTANT: When overlaying state\
      \ onto steps, use step.model_copy(update={...})\n    to ensure the model_validator\
      \ sees consistent field combinations\n    (e.g. status=SKIPPED with skipped_reason\
      \ set together).\n    \"\"\"\n```\n\nKey design invariant:\n  merge_plan(strip_state(plan),\
      \ extract_state(plan)) should be equivalent to the original plan.\n  This is\
      \ the fundamental correctness property to test.\n\nFile: src/vectl/io.py\nNew\
      \ imports: from vectl.models import StepState, PhaseState, PlanState (add to\
      \ existing import)\nPattern: Pure functions, no side effects, no file I/O"
    verification: 'L1: test that extract_state -> strip_state -> merge_plan roundtrips
      correctly; test each function independently with edge cases (empty plan, plan
      with all status types)'
    depends_on:
