- id: unified-state-merge-driver
  name: 'Unified State: Multi-User Merge Driver'
  status: pending
  gate: Merge driver resolves non-conflicting step-level changes automatically. Conflicting
    same-step edits are flagged for human resolution. vectl init configures .gitattributes
    and git merge driver.
  depends_on:
  - unified-state-migration
  steps:
  - id: unified-state-merge-driver.implement-merge-driver
    name: Implement merge driver
    status: pending
    description: "Implement the vectl merge-driver for step-level YAML merge resolution.\n\
      \nCreate new file: src/vectl/merge_driver.py\n\nFunction: merge_plans(base_path:\
      \ str, ours_path: str, theirs_path: str) -> int\n\nAlgorithm (per ADR):\n1.\
      \ Parse base (O), ours (A), theirs (B) as YAML -> Plan objects\n   - Use load_plan_definition()\
      \ for each\n   - Handle parse errors gracefully (return 1 = conflict)\n2. Build\
      \ step index for each plan: dict[step_id -> Step]\n3. Build phase index for\
      \ each plan: dict[phase_id -> Phase]\n4. For each step_id in union(base, ours,\
      \ theirs):\n   a. If step only in ours or only in theirs: keep (addition)\n\
      \   b. If step in base but removed in one side: respect deletion\n   c. If step\
      \ modified in ours only: use ours version\n   d. If step modified in theirs\
      \ only: use theirs version\n   e. If step modified in BOTH sides (different\
      \ from base): CONFLICT\n      - Write conflict markers to ours file\n      -\
      \ Return 1\n5. For phase-level changes: same logic (add/remove/modify)\n6. For\
      \ plan-level metadata (project, context, etc.): ours wins\n7. Write merged result\
      \ to ours_path (A) per git merge driver convention\n8. Return 0 (success) or\
      \ 1 (conflict)\n\n'Modified' detection: compare step.model_dump() for equality.\n\
      \nAlso add CLI command:\n\nFile: src/vectl/cli.py\nCommand: vectl merge-driver\
      \ %O %A %B\n- Positional args: base, ours, theirs (file paths)\n- Calls merge_plans()\n\
      - Exit code: 0 (merged) or 1 (conflict)\n- This is called by git, not by users\
      \ directly\n\nConstraints:\n- Must handle malformed YAML gracefully (return\
      \ 1)\n- Must handle missing files gracefully (return 1)\n- Must be fast (called\
      \ during git merge)\n- Must not modify base or theirs files\n- Must not produce\
      \ git commits (git handles that)"
    verification: pytest tests/test_merge_driver.py -v passes. Merge driver resolves
      non-conflicting changes. Conflicts produce exit code 1.
    refs:
    - docs/ADR-unified-state.md
    agent: python-senior
  - id: unified-state-merge-driver.add-gitattributes-config
    name: Add .gitattributes configuration to vectl init
    status: pending
    description: "Update vectl init to configure the merge driver.\n\nFile: src/vectl/core.py\
      \ (init logic) or wherever vectl init is implemented\nFile: src/vectl/cli.py\
      \ (init command)\n\nChanges to vectl init:\n1. After creating plan.yaml, add\
      \ to .gitattributes:\n   `plan.yaml merge=vectl`\n   - Create .gitattributes\
      \ if it does not exist\n   - Append line if .gitattributes exists but does not\
      \ contain the entry\n   - Skip if entry already present\n2. Run: `git config\
      \ merge.vectl.driver \"uvx vectl merge-driver %O %A %B\"`\n   - This configures\
      \ the local repo's merge driver\n3. Log: 'Configured merge driver: plan.yaml\
      \ merge=vectl'\n\nAlso update vectl_init MCP tool if it has separate init logic.\n\
      \nEdge cases:\n- .gitattributes exists with other entries: append, don't overwrite\n\
      - .gitattributes already has plan.yaml merge=vectl: skip (idempotent)\n- Not\
      \ in a git repo: skip git config, warn\n- git config fails: warn but don't fail\
      \ init"
    verification: vectl init creates correct .gitattributes entry and git config.
      Idempotent on re-run.
    refs:
    - src/vectl/cli.py
    - src/vectl/core.py
    - docs/ADR-unified-state.md
    depends_on:
    - unified-state-merge-driver.implement-merge-driver
    agent: python-executor
  - id: unified-state-merge-driver.merge-driver-tests
    name: Merge driver tests
    status: pending
    description: 'Integration tests for the merge driver.


      Create: tests/test_merge_driver.py


      Test cases:

      1. test_merge_different_steps_completed: User A completes step X, User B completes
      step Y -> auto-merged, both steps done

      2. test_merge_same_step_conflict: User A and B both complete the same step with
      different evidence -> conflict (exit 1)

      3. test_merge_add_step_and_complete: User A adds new step, User B completes
      existing step -> auto-merged

      4. test_merge_structural_and_state: User A adds phase, User B completes step
