  - id: unified-state-merge-driver.fix-move-payload-conflict
    name: Fix same-step mixed-modification conflict
    status: done
    description: 'HIGH PRIORITY blocker fix for merge-driver same-step conflict detection.


      Update `src/vectl/merge_driver.py` so the ADR rule is enforced: if the same
      step is modified on both sides relative to base, the merge must conflict (exit
      1), including the mixed case where one side moves the step between phases and
      the other side changes that step payload/status.


      Failure-mode checklist:

      - relative vs absolute path behavior must remain unchanged for merge-driver
      file inputs

      - missing-file fallback still returns conflict/exit 1

      - explicit clear / null overwrite semantics for step fields must not silently
      mask a dual-side modification

      - stale-definition vs new-state precedence must not auto-merge a moved step
      when the same step payload/status also changed on the other side

      - partial-write / conflict path must preserve conflict signaling and avoid emitting
      a false clean merge


      State semantics:

      - last-writer-wins does NOT apply when both sides modify the same step

      - exact preservation is required for one-sided changes and non-overlapping step
      edits

      - backward-compatible behavior keeps auto-merge only for distinct-step or identical
      same-step changes


      Regression scope:

      - update focused merge-driver logic in `src/vectl/merge_driver.py`

      - include call-site compatibility only within the current merge-driver code
      path; no unrelated CLI or init refactor

      - out of scope: changing ADR policy, expanding merge behavior beyond same-step
      conflict detection, or broad plan-merge redesign'
