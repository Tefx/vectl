- id: affinity
  name: Agent Affinity Enforcement
  status: pending
  gate: All affinity tests pass; existing claim tests unaffected
  steps:
  - id: affinity.design-rfc
    name: Design RFC
    status: pending
    description: "Create `docs/RFC-affinity.md` documenting the agent affinity feature.\n\
      \nContents:\n- Problem statement: blind-tester scenario, workflow discipline\n\
      - Decision record: default=suggested, opt-in exclusive, --force escape hatch\n\
      - Data model changes: Step.affinity (suggested|exclusive), Plan.default_affinity\n\
      - Claim behavior matrix:\n  | agent field | affinity | claimed_by matches |\
      \ result |\n  | empty | any | — | allow (no check) |\n  | set | suggested |\
      \ no | warn + allow |\n  | set | exclusive | no | reject (require --force) |\n\
      \  | set | exclusive | yes | allow |\n- Force override: sets `affinity_override:\
      \ true` on step for audit trail\n- CLI UX: warning format, error format, exit\
      \ codes\n- MCP UX: structured `affinity_warning` field in claim response\n-\
      \ Backward compatibility: no agent field → no enforcement, zero friction"
    verification: RFC reviewed and consistent with implementation steps
  - id: affinity.data-model-changes
    name: Data model changes
    status: pending
    description: "Update `src/vectl/models.py`:\n\n1. Add `Affinity` enum:\n   - SUGGESTED\
      \ = \"suggested\"\n   - EXCLUSIVE = \"exclusive\"\n\n2. Add field to `Step`:\n\
      \   - `affinity: Affinity | None = None`\n   - None means \"use plan default\"\
      \n\n3. Add field to `Plan`:\n   - `default_affinity: Affinity = Affinity.SUGGESTED`\n\
      \n4. Add field to `Step`:\n   - `affinity_override: bool = False`\n   - Set\
      \ to True when --force overrides exclusive affinity\n\n5. YAML round-trip: affinity=None\
      \ and affinity_override=False should be omitted (exclude_none/exclude_defaults\
      \ pattern).\n\nBackward compat: existing plan.yaml files without these fields\
      \ load correctly with defaults."
    verification: uv run pytest tests/test_models.py -v
    depends_on:
    - affinity.design-rfc
  - id: affinity.core-claim-enforcement-logic
    name: Core claim enforcement logic
    status: pending
    description: "Update `src/vectl/core.py` `claim_step()`:\n\n1. Resolve effective\
      \ affinity: `step.affinity or plan.default_affinity`\n2. If step.agent is set\
      \ and agent_name != step.agent:\n   - If effective affinity == SUGGESTED: proceed\
      \ but return warning metadata\n   - If effective affinity == EXCLUSIVE: raise\
      \ PlanError unless force=True\n3. Add `force: bool = False` parameter to `claim_step()`\n\
      4. When force=True on exclusive mismatch: allow claim, set `step.affinity_override\
      \ = True`\n5. Return type enhancement: `claim_step()` returns `(Plan, ClaimResult)`\
      \ where ClaimResult is a dataclass with `affinity_warning: bool`, `warning_message:\
      \ str | None`\n\nNew exception or error path:\n- `AffinityError(PlanError)`\
      \ with message: \"Step {id} has exclusive affinity for '{agent}'. Use --force\
      \ to override.\""
    verification: uv run pytest tests/test_logic.py -v -k affinity
    depends_on:
    - affinity.data-model-changes
  - id: affinity.cli-integration
    name: CLI integration
    status: pending
    description: "Update `src/vectl/cli.py`:\n\n1. `vectl claim` command:\n   - Add\
      \ `--force` flag (default False)\n   - On suggested affinity warning: print\
      \ yellow warning via Rich, proceed, exit 0\n   - On exclusive affinity mismatch\
      \ without --force: print red error, exit 1\n   - On exclusive affinity mismatch\
      \ with --force: print yellow warning \"Overriding exclusive affinity (recorded)\"\
      , proceed, exit 0\n   - Warning format: \"⚠ Step {id} is suggested for '{agent}'.\
      \ Claiming as '{claimed_by}'.\"\n   - Error format: \"✗ Step {id} has exclusive\
      \ affinity for '{agent}'. Use --force to override.\"\n\n2. `vectl show` command:\n\
      \   - Display affinity field when set (e.g., \"Affinity: exclusive\")\n   -\
      \ Display affinity_override: true as \"⚠ Affinity overridden\" if present\n\n\
      3. `vectl status` / `vectl next`:\n   - Show exclusive icon (e.g., \U0001F510\
      ) next to steps with exclusive affinity in step listings"
    verification: vectl claim --help shows --force flag; manual test with exclusive
      step
    depends_on:
    - affinity.core-claim-enforcement-logic
  - id: affinity.mcp-integration
    name: MCP integration
    status: pending
    description: "Update `src/vectl/mcp_server.py` `vectl_claim` tool:\n\n1. Add `force:\
      \ bool = False` parameter to vectl_claim\n2. On suggested affinity warning:\
      \ include in response markdown:\n   \"⚠ **Affinity warning:** Step {id} is suggested\
      \ for '{agent}'. Claimed as '{claimed_by}'.\"\n   Add `affinity_warning: true`\
      \ to structured response metadata\n3. On exclusive affinity mismatch without\
      \ force: return error message:\n   \"✗ Step {id} has exclusive affinity for\
      \ '{agent}'. Pass force=true to override.\"\n4. On exclusive with force: include\
