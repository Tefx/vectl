- id: ss-mcp
  name: MCP Server Refactor
  status: pending
  gate: All MCP tools work correctly with split state; lazy migration transparent;
    existing test suite passes
  depends_on:
  - ss-io
  steps:
  - id: ss-mcp.load-save-refactor
    name: load-save-refactor
    status: pending
    description: "Refactor the MCP server's _load(), _save() and add new _save_state()/_save_definition()/_save_both()\
      \ in src/vectl/mcp_server.py.\n\nThis is the core architectural change for state\
      \ separation in the MCP layer.\n\nCurrent signatures:\n```python\ndef _load()\
      \ -> tuple[Plan, str]:  # (plan, hash)\ndef _save(plan: Plan, expected_hash:\
      \ str) -> str:  # returns lock notice\n```\n\nNew signatures:\n```python\ndef\
      \ _load() -> tuple[Plan, str, str]:\n    \"\"\"Load plan with state, returning\
      \ (merged_plan, def_hash, state_hash).\n    \n    Strategy (lazy migration):\n\
      \    1. Load plan definition from plan.yaml -> (plan_def, def_hash)\n    2.\
      \ Attempt to load state from resolve_state_path() -> (state, state_hash)\n \
      \   3. If state.json exists and is non-empty:\n       - merged = merge_plan(plan_def,\
      \ state)\n       - return (merged, def_hash, state_hash)\n    4. If state.json\
      \ does not exist (legacy/first-run):\n       - The plan.yaml may contain embedded\
      \ state (status, claimed_by, etc.)\n       - Just return (plan_from_yaml, def_hash,\
      \ '') where '' signals no state file\n       - The embedded state in plan.yaml\
      \ is used as-is (backward compatible)\n    \"\"\"\n\ndef _save_state(plan: Plan,\
      \ expected_state_hash: str) -> str:\n    \"\"\"Save only state to .git/vectl/state.json.\n\
      \    \n    1. Extract state from plan via extract_state()\n    2. Save via save_state()\
      \ with CAS using expected_state_hash\n    3. If expected_state_hash is '' (no\
      \ prior state file), skip CAS (first write)\n    4. Return lock notice string\
      \ (from recalc_lock_status)\n    \n    Used by: state-only tools (claim, complete,\
      \ lifecycle, clipboard)\n    \"\"\"\n\ndef _save_definition(plan: Plan, expected_def_hash:\
      \ str) -> str:\n    \"\"\"Save only definition to plan.yaml (stripped of state).\n\
      \    \n    1. Strip state from plan via strip_state()\n    2. Run recalc_lock_status\
      \ on the stripped plan? No -- lock status is state.\n       Actually, lock status\
      \ is computed from phase.status which is state.\n       For the definition file,\
      \ phases should have status=PENDING (stripped).\n    3. Save via save_plan()\
      \ with CAS using expected_def_hash\n    4. Return lock notice string\n    \n\
      \    Used by: definition-only tools (check, init)\n    IMPORTANT: recalc_lock_status\
      \ should operate on the MERGED plan (with state),\n    not the stripped definition.\
      \ So the caller must handle this.\n    \"\"\"\n\ndef _save_both(plan: Plan,\
      \ expected_def_hash: str, expected_state_hash: str) -> str:\n    \"\"\"Save\
      \ both definition and state.\n    \n    1. Run recalc_lock_status(plan) on the\
      \ full merged plan\n    2. Save state via _save_state(plan, expected_state_hash)\n\
      \    3. Save definition via save_plan(strip_state(plan), plan_path, expected_def_hash)\n\
      \    4. Return combined lock notice\n    \n    Used by: mutate (when adding\
      \ steps with status), and any operation that\n    changes both definition and\
      \ state.\n    \"\"\"\n```\n\nLazy migration logic in _load():\n- When state.json\
      \ does not exist, the plan.yaml contains embedded state\n- All tools continue\
      \ to work by operating on the merged plan as before\n- The FIRST state write\
      \ (via _save_state) creates state.json\n- The NEXT definition write (via _save_definition)\
      \ will strip state from plan.yaml\n- This is a gradual, non-breaking migration\n\
      \nNew imports needed:\n- from vectl.plan_path import resolve_state_path (new\
      \ function from ss-io)\n- from vectl.io import load_state, save_state, merge_plan,\
      \ extract_state, strip_state\n\nIMPORTANT design decisions requiring judgment:\n\
      - How to handle recalc_lock_status in the split-write scenario: lock status\
      \ is a function of phase.status (state) and phase.depends_on (definition). The\
      \ recalc should happen on the merged plan before splitting writes.\n- Thread\
      \ safety of writing state.json + plan.yaml: these are two separate atomic writes.\
      \ If the process crashes between them, state.json may be ahead of plan.yaml.\
      \ This is acceptable because _load() always merges fresh.\n- The existing _save()\
