    claimed_by: vectl-engineer
    claimed_at: '2026-02-08T11:14:04.788492+00:00'
    evidence: 'commit ab1a38f: vectl status overview + --phase detail'
  - id: cli.4
    name: Help-Agent Command
    status: done
