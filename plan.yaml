- id: unified-state-migration
  name: 'Unified State: Migration'
  status: done
  gate: 'Migration works for all edge cases. Roundtrip tested: pre-v0.6 inline, v0.6+
    split-state, empty state, orphan entries. Idempotent re-run is safe.'
  depends_on:
  - unified-state-cli-mcp
  steps:
  - id: unified-state-migration.implement-migration-function
    name: Implement migration function
    status: done
    description: "Implement the state.json to plan.yaml migration function.\n\nCreate\
      \ new file: src/vectl/migration.py\n\nFunction: migrate_from_split_state(plan_path:\
      \ Path) -> MigrationResult\n\n```python\n@dataclass\nclass MigrationResult:\n\
      \    migrated_steps: int\n    migrated_phases: int\n    skipped_orphans: list[str]\
      \  # step/phase IDs in state but not plan\n    warnings: list[str]\n    already_migrated:\
      \ bool  # True if state.json.migrated already exists\n```\n\nAlgorithm (per\
      \ ADR):\n1. Resolve state.json path via resolve_state_path(plan_path)\n2. If\
      \ state.json does not exist: return MigrationResult(0, 0, [], [], False)\n3.\
      \ If state.json.migrated already exists: return MigrationResult(already_migrated=True)\n\
      4. Load state.json (using the existing load_state function, which we keep accessible\
      \ via direct import for migration)\n5. If state is empty (no steps, no phases,\
      \ no clipboard): delete state.json, return\n6. Load plan.yaml via load_plan_definition(plan_path)\n\
      7. For each step in state.steps:\n   a. Find matching step in plan by step_id\n\
      \   b. If not found: add to skipped_orphans, log warning, continue\n   c. If\
      \ found: merge fields (status, claimed_by, claimed_at, evidence, skipped_reason,\
      \ rejection_reason, rejection_history, affinity_override fields)\n   d. State\
      \ values take precedence over plan.yaml values (per ADR)\n8. For each phase\
      \ in state.phases:\n   a. Find matching phase in plan by phase_id\n   b. If\
      \ not found: add to skipped_orphans, log warning, continue\n   c. If found:\
      \ merge fields (status, evidence)\n9. If state.clipboard is not None: set plan.clipboard\
      \ = state.clipboard\n10. Save merged plan.yaml via save_plan(plan, plan_path,\
      \ commit_message='[vectl] migrate: merge state into plan')\n11. Rename state.json\
      \ -> state.json.migrated\n12. Return MigrationResult with counts\n\nEdge cases:\n\
      - Orphan entries: skip with warning (do not fail)\n- Plan already has status\
      \ fields: state.json values override\n- Empty state.json: skip, delete file\n\
      - state.json.migrated already exists: skip (idempotent)\n- Partial failure:\
      \ if save_plan succeeds but rename fails, next run detects state.json still\
      \ exists and re-runs (idempotent because state values override)\n\nNote: This\
      \ module needs access to load_state and PlanState from the old split-state code.\
      \ Import them directly rather than through the public API (they may be removed\
      \ from io.py by Phase 3). Consider copying the minimal load_state logic inline\
      \ or importing before removal.\n\nIMPORTANT: This step should be implemented\
      \ AFTER Phase 3 removes the old functions. The migration module should contain\
      \ its own minimal state.json reader (JSON load + dict parse) rather than depending\
      \ on the removed load_state function."
    verification: pytest tests/test_migration.py -v passes. Migration function handles
      all edge cases. Idempotent re-run is safe.
