    name: Adapt claim_step for claims.json
    status: pending
    description: "Modify claim_step() in core.py to use the new claims module for\
      \ ephemeral coordination.\n\nFile: src/vectl/core.py\nFunction: claim_step()\
      \ (line ~315)\n\nCurrent behavior:\n- Sets step.status = CLAIMED, step.claimed_by\
