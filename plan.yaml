    name: affordance hints on all commands
    status: pending
    description: Every command output ends with hints for what to do next.
    depends_on:
    - cli-ux-enhancements.show-command
    - cli-ux-enhancements.claim-returns-full-spec
    - cli-ux-enhancements.next-with-summary
    - cli-ux-enhancements.complete-returns-next
- id: cli-refactoring
  name: CLI Refactoring
  status: pending
  depends_on:
  - cli-ux-enhancements
  steps:
  - id: cli-refactoring.rename-update-checklist-to-check
    name: rename update-checklist to check
    status: pending
    description: update-checklist STEP --check keyword -> check STEP keyword. check
      STEP --add text for append.
    depends_on:
    - flag-alias-unification
  - id: cli-refactoring.rename-help-agent-to-guide
    name: rename help-agent to guide
    status: pending
    description: help-agent --context X -> guide --on startup|stuck|review.
    depends_on:
    - flag-alias-unification
  - id: cli-refactoring.unify-actor-flags-and-env-vars
    name: unify actor flags and env vars
    status: pending
    description: --agent/--reviewer -> --by. VECTL_AGENT env var default. VECTL_PLAN
      env var for plan path.
    depends_on:
    - flag-alias-unification
  - id: cli-refactoring.shorten-flag-names
    name: shorten flag names
    status: pending
    description: --depends-on -> --after, --description -> --desc, --verification
      -> --verify globally.
    depends_on:
    - flag-alias-unification
  - id: flag-alias-unification
    name: Flag alias unification
    status: pending
    description: 'Accept both short and long forms for all flags: --desc/--description,
      --ctx/--context, --verify/--verification. Must be done BEFORE renames so renames
      become non-breaking changes. Uses Typer multiple option names feature.'
    verification: Both --desc and --description work on add-step; both --ctx and --context
      work on add-phase; tests pass
- id: correctness-fixes
  name: Correctness Fixes
  status: pending
  gate: uv run pytest tests/ -v passes, auto-unlock persists correctly
  context: 'P0: Fix CQS violation in _get_active_phase_ids and cascade unlock on complete.
    All three experts flagged as correctness bugs.'
  depends_on:
  - core
  steps:
  - id: correctness-fixes.fix-cqs-violation-in-get-active-phase-ids
    name: Fix CQS Violation in _get_active_phase_ids
    status: pending
    description: Split _get_active_phase_ids into pure query (no mutation) + explicit
      auto_unlock_phases(). Query returns active/eligible phase IDs without mutating
      phase.status. All three experts flagged as correctness bug, not tech debt.
    verification: 'vectl next and vectl status agree on lock state; new test: test_get_active_does_not_mutate;
      pytest tests/test_logic.py passes'
  - id: correctness-fixes.cascade-unlock-on-complete
    name: Cascade Unlock on Complete
    status: pending
    description: When complete_step() finishes last step in phase (triggering DONE),
      call auto_unlock_phases() to persist downstream unlocks to disk. Currently unlocks
      only happen in memory via get_next_steps().
    verification: 'Complete last step in phase A -> downstream phase B shows pending
      in status; new test: test_complete_cascades_unlock; all tests pass'
    depends_on:
    - correctness-fixes.fix-cqs-violation-in-get-active-phase-ids
- id: code-hygiene
  name: Code Hygiene
  status: pending
  gate: mypy passes, no star imports in core.py
  context: 'P1: Remove star imports, fix sentinel type safety, add move-step dep warning.
    SE Expert recommendations.'
  depends_on:
  - correctness-fixes
  steps:
  - id: code-hygiene.remove-star-import-re-exports-from-core-py
    name: Remove Star Import Re-exports from core.py
    status: pending
    description: 'Delete the `from vectl.io import *` and `from vectl.models import
      *` lines

      at the bottom of core.py. Fix any import breakage in cli.py or tests.

      SE Expert flagged as hidden coupling that prevents future refactoring.

      '
    verification: grep -c 'import \*' src/vectl/core.py returns 0; all tests pass
  - id: code-hygiene.fix-sentinel-type-safety
    name: Fix Sentinel Type Safety
    status: pending
    description: 'Replace _SENTINEL object pattern with _Unset Enum for proper mypy
      narrowing.

      Current `str | object` erases to `object`, losing type checking.

      SE Expert recommendation using Python enum pattern.

      '
    verification: mypy src/vectl/core.py passes; edit_step tests still pass
  - id: code-hygiene.add-move-step-dependency-warning
    name: Add move-step Dependency Warning
    status: pending
    description: 'move_step() silently clears depends_on when moving between phases
      (lossy operation).

      Add a warning to CLI output listing cleared deps. SE Expert flagged.

      '
    verification: move-step output shows "Cleared N dependencies" when deps exist
  - id: code-hygiene.update-docs-visibility
    name: update-docs-visibility
    status: pending
    description: Update tools/vectl/README.md with actual commands. Add entry to root
      AGENTS.md marking vectl as experimental/dogfood-only.
- id: agent-ux
  name: Agent UX
  status: pending
  gate: all new commands tested, affordance hints complete
  context: 'P2: Auto-claim without args, hint completeness for all states, mine/resume
    command. LLM Agent Expert recommendations.'
  depends_on:
  - correctness-fixes
  steps:
  - id: agent-ux.auto-claim-without-arguments
    name: Auto-Claim Without Arguments
    status: pending
    description: 'Make step_id optional in claim command. When omitted, call get_next_steps()

      and auto-claim the first available step. LLM Agent Expert P1 recommendation
      -

      halves common-path tool calls (next+claim -> claim).

      '
    verification: vectl claim --agent test auto-picks first available step; tests
      pass
  - id: agent-ux.hint-completeness-for-all-step-states
    name: Hint Completeness for All Step States
    status: pending
    description: 'Add affordance hints for DONE, SKIPPED, REJECTED step states in
      show/status output.

      Currently these states produce no hints (dead-end UX).

      DONE -> suggest next or reject; CLAIMED -> add defer hint; REJECTED -> suggest
      re-claim.

      '
    verification: show on done/skipped/rejected steps shows appropriate hints
  - id: agent-ux.mine-command-for-agent-recovery
    name: Mine Command for Agent Recovery
    status: pending
    description: 'Add `vectl mine --agent <name>` command showing currently claimed
      steps for a given agent.

      Enables crash recovery - agent can find what it was working on after context
      reset.

      LLM Agent Expert P2 recommendation.

      '
    verification: vectl mine --agent X shows claimed steps; uv run pytest tests/test_cli.py
      passes
  - id: agent-ux.next-limit-default
    name: next --limit default
    status: pending
    description: 'Cap next output to 3 items by default. Add --limit N flag and --all
      flag.

      3 is the principled choice: best option + two alternatives (decide-and-act semantics).

      Expert panel consensus after SE Expert changed position.

      '
    verification: vectl next shows at most 3 items; --limit 5 shows 5; --all shows
      everything; tests pass
  - id: agent-ux.long-slug-warning
    name: Long slug warning
    status: pending
    description: 'When auto-generated slug exceeds 40 chars, print affordance hint

      suggesting --id override for shorter manual ID.

      Applies to add-step and add-phase commands.

      '
    verification: add-step with long name shows "Slug is N chars. Use --id to set
      shorter" hint
- id: quality
  name: Quality
  status: pending
  gate: hypothesis tests pass, no naming collisions
  context: 'P3: Property-based testing for state machine, rename ValidationError to
    avoid shadowing. Diamond-pattern convergence point.'
  depends_on:
  - code-hygiene
  - agent-ux
  - command-enrichment
  steps:
  - id: quality.property-based-state-machine-tests
    name: Property-Based State Machine Tests
    status: pending
    description: 'Add Hypothesis stateful tests for the plan state machine. Golden
      property:

      any sequence of valid operations produces a plan that passes validate_plan().

      Generate random claim/complete/skip/defer/reject sequences on a fixed plan.

      All three experts agreed this is high-value testing investment.

      '
    verification: uv run pytest tests/test_properties.py -v passes with >100 examples
  - id: quality.rename-validationerror-to-avoid-shadowing
    name: Rename ValidationError to Avoid Shadowing
    status: pending
    description: 'Rename ValidationError to PlanValidationIssue or DiagnosticMessage.

      Current name shadows pydantic.ValidationError and common ValueError pattern.

      SE Expert flagged as eventual collision. Low priority but clean.

      '
    verification: grep -r ValidationError shows only new name; all tests pass
- id: command-enrichment
  name: Command Enrichment
  status: pending
