version: 1
project: vectl
strategy_ref: tools/vectl/README.md
context: 'Bootstrapping vectl development.

  PHILOSOPHY: Clean code, comprehensive tests, self-hosting.

  METHODOLOGY: Models → IO → Logic → CLI → MCP.

  CONSTRAINT: Zero imports from eidos-*. Pure standalone tool.

  '
phases:
- id: core
  name: Core Logic
  status: done
  gate: All core unit tests pass
  context: 'Foundation layer. Pydantic models, atomic YAML IO,

    DAG validation, state machine, and query logic.

    Everything else builds on this.

    '
  steps:
  - id: core.1
    name: Pydantic Data Models
    status: done
    description: 'Define all data models in core.py:

      - StepStatus enum (pending, claimed, done, skipped, rejected)

      - PhaseStatus enum (locked, pending, in_progress, done)

      - RejectionEntry model

      - Step model (with model_validator for skipped/rejected reasons)

      - Phase model (with depends_on for DAG)

      - Plan model (with context and strategy_ref)

      '
    verification: uv run pytest tools/vectl/tests/test_models.py -v
    refs:
    - tools/vectl/README.md
  - id: core.2
    name: YAML IO with CAS
    status: done
    description: 'Implement in core.py:

      - load_plan(path) -> Plan: Read YAML, parse to Pydantic

      - save_plan(plan, path): Atomic write (temp file + rename)

      - CAS check: hash before read, verify before write, retry 3x

      Ensure round-trip fidelity (load → save → load == identical).

      '
    verification: uv run pytest tools/vectl/tests/test_io.py -v
    depends_on:
    - core.1
  - id: core.3
    name: DAG Validation
    status: done
    description: "Implement in core.py:\n- validate_plan(plan) -> list[Error]:\n \
      \ - Phase DAG: cycle detection, valid depends_on refs\n  - Step DAG: cycle detection\
      \ within phase, valid depends_on refs\n  - ID uniqueness (phase IDs, step IDs\
      \ within phase)\n  - Status consistency (no done step in locked phase, etc.)\n\
      \  - Skipped/rejected reason enforcement\n- Spec anchor check: verify files\
      \ in refs[] exist on disk\n"
    verification: uv run pytest tools/vectl/tests/test_validation.py -v
    depends_on:
    - core.1
  - id: core.4
    name: State Machine & Query Logic
    status: done
    description: "Implement in core.py:\n- get_next_steps(plan) -> list[Step]:\n \
      \ Find all claimable steps across active phases.\n  Respect phase DAG (locked\
      \ phases excluded).\n  Respect step DAG (blocked steps excluded).\n  Highlight\
      \ rejected steps with priority.\n- claim_step(plan, step_id, agent_name) ->\
      \ Plan:\n  Validate step is claimable. Set status, claimed_by, claimed_at.\n\
      - complete_step(plan, step_id, evidence) -> Plan:\n  Validate step is claimed.\
      \ Set status, evidence.\n  Auto-update phase status if all steps done.\n- defer_step(plan,\
      \ step_id) -> Plan:\n  Return to pending. Clear claimed_by/at.\n- reject_step(plan,\
      \ step_id, reason, reviewer) -> Plan:\n  Set rejected status. Append to rejection_history.\n\
      - skip_step(plan, step_id, reason) -> Plan:\n  Set skipped with reason.\n"
    verification: uv run pytest tools/vectl/tests/test_logic.py -v
    depends_on:
    - core.2
    - core.3
  - id: core.5
    name: Checklist Operations
    status: done
    description: "Implement in core.py:\n- update_checklist(plan, step_id, check=None,\
      \ append=None) -> Plan:\n  If check: fuzzy match checklist item in description,\
      \ toggle [x].\n  If append: add new \"- [ ] item\" to description.\n  Fuzzy\
      \ match: case-insensitive substring match on item text.\n  If multiple matches,\
      \ raise AmbiguousMatch with candidates.\n  If no match, raise NoMatch with suggestion\
      \ to use --append.\n"
    verification: uv run pytest tools/vectl/tests/test_checklist.py -v
    depends_on:
    - core.2
- id: cli_read
  name: CLI Read Commands
  status: done
  gate: All CLI read commands work against real plan.yaml
  context: 'Read-only CLI using Typer + Rich.

    After this phase, agents can query the plan but not modify it.

    '
  depends_on:
  - core
  steps:
  - id: cli.1
    name: CLI Scaffold + Init
    status: done
    description: 'Create cli.py with Typer app.

      Implement: vectl init

      - Creates plan.yaml with project name prompt

      - Generates minimal valid template

      Implement: vectl --version

      '
    verification: vectl init --help && vectl --version
    claimed_by: vectl-engineer
    claimed_at: '2026-02-08T11:14:04.218477+00:00'
    evidence: 'commit ab1a38f: Typer app + init + --version'
  - id: cli.2
