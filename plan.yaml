    depends_on:
    - affinity.core-claim-enforcement-logic
  - id: affinity.tests
    name: Tests
    status: pending
    description: 'Comprehensive tests for affinity enforcement:


      **Model tests (test_models.py):**

      - Affinity enum values

      - Step with affinity=None loads correctly (backward compat)

      - Plan with default_affinity loads correctly

      - YAML round-trip: affinity/affinity_override omitted when default

      - Existing plan.yaml without affinity fields loads without error


      **Core logic tests (test_logic.py or test_affinity.py):**

      - claim_step with suggested affinity + matching agent → no warning

      - claim_step with suggested affinity + mismatched agent → warning, claim succeeds

      - claim_step with exclusive affinity + matching agent → claim succeeds

      - claim_step with exclusive affinity + mismatched agent → AffinityError raised

