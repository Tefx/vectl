  - id: ss-cli.adapt-commands
    name: adapt-commands
    status: done
    description: 'Adapt all CLI commands in src/vectl/cli.py to use the new _load()/_save_state()/_save_definition()/_save_both()
      signatures.


      The CLI has many commands that use _load() and _save(). All must be updated.


      **Step 1: Update all _load() call sites**

      Search for `_load(` in cli.py. Every call currently unpacks as:

      ```python

      plan, h, plan_path = _load(plan_opt)

      ```

      Change to:

      ```python

      plan, def_h, state_h, plan_path = _load(plan_opt)

      ```


      **Step 2: Categorize and update _save() call sites**


      State-only commands (use _save_state):

      - claim: changes step status/claimed_by/claimed_at

      - complete: changes step status/evidence, may change phase status

      - defer: changes step status

      - reject: changes step status/rejection_reason/rejection_history

      - skip: changes step status/skipped_reason

      - skip-phase: changes phase status

      - clipboard write/clear: changes plan.clipboard

      - complete-phase: changes phase status/evidence


      Definition-only commands (use _save_definition):

      - check: modifies step description (checklist items)


      Both (use _save_both):

      - add-step, add-steps: adds step to phase (definition), may set status (state)

      - edit-step: may change definition fields and/or status

      - remove-step: removes step from definition

      - move-step: moves step between phases (definition)

      - add-phase: adds phase (definition)

      - edit-phase: may change definition and status

      - recalc-lock: recalculates lock status (state), but operates on full plan

      - unlock: changes phase status (state)


      Read-only commands (no _save needed, just update _load unpacking):

      - status, show, next, search, review, gate-check, render, diff, guide, checkpoint,
      dashboard


      **Step 3: Update _save() calls**

      For each command, replace:

      ```python

      _save(plan, plan_path, h)  # old

      ```

      With the appropriate new function:

      ```python

      _save_state(plan, plan_path, state_h)          # state-only

      _save_definition(plan, plan_path, def_h)       # definition-only

      _save_both(plan, plan_path, def_h, state_h)    # both

      ```


      After this step, the old _save() function should have ZERO remaining callers
      and can be removed.


      File: src/vectl/cli.py

      Scope: This is a large mechanical change -- many call sites, but each is a simple
      pattern replacement.'
