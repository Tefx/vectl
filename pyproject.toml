[project]
name = "vectl"
version = "0.1.12"
description = "Plans with teeth — TODO.md can't say no. vectl can."
readme = "README.md"
authors = [{name = "Tefx", email = "zhaomeng.zhu@gmail.com"}]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "fastmcp>=2.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Tefx/vectl"
Repository = "https://github.com/Tefx/vectl"
Issues = "https://github.com/Tefx/vectl/issues"

[project.scripts]
vectl = "vectl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.151.5",
    "pytest>=9.0",
    "pytest-cov>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
