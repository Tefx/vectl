      - linear DAG auto-drain
      - real worktree child runs with real merge back
      - phase/plan auto-close
    execution_mode: automated_live
    runner: opencode
    authoritative_surface: real_app_and_real_git_worktrees
    notes: Exercises ordered step completion through the real drive loop.

